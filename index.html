  let html = `<h1 class="page-title"><span class="clickable-title" id="payrollHomeTitle">Payroll</span> - Week ${week}</h1><p class="page-sub">${weekDateRangeLabel(week)} (Sun-Sat)</p>`;
  html += weekPickerHTML(week, "payrollWeekSelect");
  const availableDrivers = showInactive ? drivers : drivers.filter(d=>d.active);
  if(!availableDrivers.length){ html += `<div class="banner"><b>No drivers available</b>Go to Manage Fleet (hamburger menu) to add or reactivate a driver first.</div>`; mainArea.innerHTML=html;
    document.getElementById("payrollHomeTitle").addEventListener("click", ()=>{ flushIfNeeded(); currentView={type:"summary"}; renderMain(); });
    wireWeekPicker("payrollWeekSelect", w=>{ currentView={type:"week", week:w}; renderMain(); }); return; }
  html += `<table class="logtable"><thead><tr><th>Driver</th><th>Truck Used</th><th>Amount</th><th></th></tr></thead><tbody id="payrollTbody">`;
  entries.forEach((e,idx)=>{ html += payrollRowHTML(e, idx, active, availableDrivers); });
  html += `</tbody></table><div class="addrow-wrap"><button class="btn-blue btn-sm" id="addPayrollRow">+ Add Entry</button></div>`;
  mainArea.innerHTML = html;
  document.getElementById("payrollHomeTitle").addEventListener("click", ()=>{ flushIfNeeded(); currentView={type:"summary"}; renderMain(); });
  wireWeekPicker("payrollWeekSelect", w=>{ currentView={type:"week", week:w}; renderMain(); });
  wirePayrollTable(week, active, availableDrivers);
}
function payrollRowHTML(e, idx, active, availableDrivers){
  const driverOptions = availableDrivers.map(d=>`<option value="${d.name}" ${e.driver===d.name?'selected':''}>${d.name}${d.active?'':' (inactive)'}</option>`).join("");
  const orphanDriverOption = (e.driver && !availableDrivers.some(d=>d.name===e.driver)) ? `<option value="${e.driver}" selected>${e.driver} (removed)</option>` : "";
  const truckOptions = active.map(v=>`<option value="${v.truckId}" ${e.truck===v.truckId?'selected':''}>${v.truckId}${v.active?'':' (inactive)'}</option>`).join("");
  const orphanTruckOption = (e.truck && !active.some(v=>v.truckId===e.truck)) ? `<option value="${e.truck}" selected>${e.truck} (removed)</option>` : "";
  return `<tr data-idx="${idx}">
    <td><select class="pr-driver"><option value="">-</option>${orphanDriverOption}${driverOptions}</select></td>
    <td><select class="pr-truck"><option value="">-</option>${orphanTruckOption}${truckOptions}</select></td>
    <td><input class="pr-amount" type="number" step="0.01" min="0" value="${e.amount||''}"></td>
    <td><button class="btn-danger pr-delete">Remove</button></td>
  </tr>`;
}
function wirePayrollTable(week, active, availableDrivers){
  const entries = payrollEntries.filter(e=>e.week===week);
  const tbody = document.getElementById("payrollTbody");
  tbody.querySelectorAll("tr").forEach(tr=>{
    const idx = parseInt(tr.dataset.idx);
    tr.querySelector(".pr-driver").addEventListener("change", e=>{ entries[idx].driver=e.target.value; markUnsaved(); });
    tr.querySelector(".pr-truck").addEventListener("change", e=>{ entries[idx].truck=e.target.value; markUnsaved(); });
    tr.querySelector(".pr-amount").addEventListener("input", e=>{ entries[idx].amount=e.target.value; markUnsaved(); });
    tr.querySelector(".pr-delete").addEventListener("click", ()=>{
      const globalIdx = payrollEntries.indexOf(entries[idx]);
      if(globalIdx>=0) payrollEntries.splice(globalIdx,1);
      markUnsaved(); renderMain();
    });
  });
  document.getElementById("addPayrollRow").addEventListener("click", ()=>{
    payrollEntries.push({ week, driver:"", truck:"", amount:"" });
    markUnsaved(); renderMain();
  });
}

/* ============ LOG PAGES (Parts / Mechanic / Maintenance) ============ */
function getLogArray(key){ if(key==="parts") return partsLog; if(key==="mechanic") return mechanicLog; return maintenanceLog; }
function renderLogPage(cfg){
  const entries = getLogArray(cfg.key);
  const summary = computeLogSummary(entries, cfg.summaryType);
  let html = `<h1 class="page-title">${cfg.title}</h1><p class="page-sub">${cfg.subtitle}</p>`;
  if(cfg.key==="parts"||cfg.key==="mechanic") html += subtabsHTML();
  if(!vehicles.filter(v=>v.active).length) html += `<div class="banner"><b>No active vehicles</b>Go to Manage Fleet (hamburger menu) to add or reactivate one.</div>`;
  html += `<div class="cards summary-cards">`;
  vehicles.filter(v=>v.active).forEach(v=>{
    const truck=v.truckId;
    const val = cfg.summaryType==="sum" ? summary.sums[truck] : summary.maxes[truck];
    const display = cfg.currency ? moneyStr(val) : val.toLocaleString();
    html += `<div class="card"><h3>Truck <span class="tag">${truck}</span></h3><div class="metric"><div class="label">${cfg.summaryLabel}</div><div class="big">${display}</div></div></div>`;
  });
  if(cfg.summaryType==="sum") html += `<div class="card company"><h3>${cfg.companyLabel}</h3><div class="metric"><div class="big">${moneyStr(summary.grand)}</div></div></div>`;
  html += `</div>`;
  html += `<div class="section-label">Entry Log</div><p class="hint">Truck dropdown includes inactive vehicles too, so you can still log/edit entries for a truck no longer in active use.</p>`;
  html += `<table class="logtable"><thead><tr><th>Truck</th><th>${cfg.colHeaders[0]}</th><th>${cfg.colHeaders[1]}</th><th>${cfg.colHeaders[2]}</th><th>Receipt</th><th></th></tr></thead><tbody id="logTbody">`;
  entries.forEach((e,idx)=>{ html += logRowHTML(cfg, e, idx); });
  html += `</tbody></table><div class="addrow-wrap"><button class="btn-blue btn-sm" id="addLogRow">+ Add Entry</button>`;
  if(cfg.key==="parts" || cfg.key==="mechanic"){
    html += ` <button class="btn-ghost btn-sm" id="takePhotoBtn" style="background:var(--charcoal);">Take Photo</button>`;
    html += ` <button class="btn-ghost btn-sm" id="uploadFileBtn" style="background:var(--charcoal);">Upload Image/PDF</button>`;
  }
  html += `</div>`;
  mainArea.innerHTML = html;
  if(cfg.key==="parts"||cfg.key==="mechanic") wireSubtabs();
  wireLogTable(cfg);
  if(cfg.key==="parts" || cfg.key==="mechanic"){
    document.getElementById("takePhotoBtn").addEventListener("click", ()=>scanReceiptForLog(cfg, "camera"));
    document.getElementById("uploadFileBtn").addEventListener("click", ()=>scanReceiptForLog(cfg, "upload"));
  }
}
function logRowHTML(cfg, e, idx){
  const truckOptions = vehicles.map(v=>`<option value="${v.truckId}" ${e.truck===v.truckId?'selected':''}>${v.truckId}${v.active?'':' (inactive)'}</option>`).join("");
  const f0=cfg.fieldOrder[0], f1=cfg.fieldOrder[1], f2=cfg.fieldOrder[2];
  const type0=f0==="date"?"date":"text", type1=f1==="date"?"date":"text", type2=f2==="amount"?"number":(f2==="date"?"date":"text");
  const hasReceipt = e.receiptPath && receiptPathList(e.receiptPath).length > 0;
  const viewBtn = hasReceipt ? `<button class="btn-ghost btn-sm log-view-receipt" style="background:var(--charcoal); white-space:nowrap;">View Receipt</button>` : "";
  return `<tr data-idx="${idx}">
    <td><select class="log-truck"><option value="">-</option>${truckOptions}</select></td>
    <td><input class="log-f0" type="${type0}" value="${e[f0]||''}"></td>
    <td><input class="log-f1" type="${type1}" value="${e[f1]||''}"></td>
    <td><input class="log-f2" type="${type2}" ${type2==='number'?'step="0.01" min="0"':''} value="${e[f2]||''}"></td>
    <td>${viewBtn}</td>
    <td><button class="btn-danger log-delete">Remove</button></td>
  </tr>`;
}
function wireLogTable(cfg){
  const entries = getLogArray(cfg.key);
  const tbody = document.getElementById("logTbody");
  tbody.querySelectorAll("tr").forEach(tr=>{
    const idx=parseInt(tr.dataset.idx);
    tr.querySelector(".log-truck").addEventListener("change", e=>{ entries[idx].truck=e.target.value; markUnsaved(); refreshLogSummary(cfg); });
    tr.querySelector(".log-f0").addEventListener("input", e=>{ entries[idx][cfg.fieldOrder[0]]=e.target.value; markUnsaved(); });
    tr.querySelector(".log-f1").addEventListener("input", e=>{ entries[idx][cfg.fieldOrder[1]]=e.target.value; markUnsaved(); });
    tr.querySelector(".log-f2").addEventListener("input", e=>{ entries[idx][cfg.fieldOrder[2]]=e.target.value; markUnsaved(); refreshLogSummary(cfg); });
    tr.querySelector(".log-delete").addEventListener("click", ()=>{ entries.splice(idx,1); markUnsaved(); renderMain(); });
    const viewBtn = tr.querySelector(".log-view-receipt");
    if(viewBtn) viewBtn.addEventListener("click", ()=>openDocumentPreviewModal(entries[idx].receiptPath, ()=>{ entries[idx].receiptPath=""; markUnsaved(); renderMain(); }));
  });
  document.getElementById("addLogRow").addEventListener("click", ()=>{
    const blank={truck:""}; blank[cfg.fieldOrder[0]]=""; blank[cfg.fieldOrder[1]]=""; blank[cfg.fieldOrder[2]]="";
    entries.push(blank); markUnsaved(); renderMain();
  });
}
function refreshLogSummary(cfg){
  const entries = getLogArray(cfg.key); const summary = computeLogSummary(entries, cfg.summaryType);
  const activeV = vehicles.filter(v=>v.active);
  const cards = mainArea.querySelectorAll(".summary-cards .card");
  activeV.forEach((v,i)=>{
    const val = cfg.summaryType==="sum" ? summary.sums[v.truckId] : summary.maxes[v.truckId];
    const display = cfg.currency ? moneyStr(val) : val.toLocaleString();
    const bigEl = cards[i] && cards[i].querySelector(".big"); if(bigEl) bigEl.textContent = display;
  });
  if(cfg.summaryType==="sum" && cards[activeV.length]){
    const bigEl = cards[activeV.length].querySelector(".big"); if(bigEl) bigEl.textContent = moneyStr(summary.grand);
  }
}

/* ============ FILE-LESS NAV EVENTS ============ */
document.getElementById("brandHomeBtn").addEventListener("click", ()=>{
  flushIfNeeded();
  currentModule="contracts"; currentExpenseTab="overview"; currentView={type:"summary"};
  hamburgerMenu.querySelectorAll("button[data-module]").forEach(x=>x.classList.remove("active"));
  hamburgerMenu.querySelector('button[data-module="contracts"]').classList.add("active");
  renderMain();
});
hamburgerBtn.addEventListener("click", e=>{ e.stopPropagation(); hamburgerMenu.classList.toggle("hidden"); });
document.addEventListener("click", ()=>{ hamburgerMenu.classList.add("hidden"); });
hamburgerMenu.querySelectorAll("button").forEach(b=>{
  b.addEventListener("click", async e=>{
    e.stopPropagation();
    if(b.dataset.action==="export"){ exportExcel(); hamburgerMenu.classList.add("hidden"); return; }
    if(b.dataset.action==="signout"){ flushIfNeeded(); await sb.auth.signOut(); return; }
    flushIfNeeded();
    currentModule = b.dataset.module;
    if(currentModule==="expenses") currentExpenseTab="overview";
    currentView={type:"summary"};
    hamburgerMenu.querySelectorAll("button[data-module]").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); hamburgerMenu.classList.add("hidden");
    renderMain();
  });
});

/* ============ AUTH ============ */
let authMode="signin";
const authEmail=document.getElementById("authEmail"), authPassword=document.getElementById("authPassword");
const authSubmitBtn=document.getElementById("authSubmitBtn"), authError=document.getElementById("authError");
const authToggle=document.getElementById("authToggle"), authToggleLink=document.getElementById("authToggleLink");
authToggleLink.addEventListener("click", ()=>{
  authMode = authMode==="signin" ? "signup" : "signin";
  authSubmitBtn.textContent = authMode==="signin" ? "Sign In" : "Create Account";
  authToggle.innerHTML = authMode==="signin" ? `Don't have an account? <a id="authToggleLink">Sign up</a>` : `Already have an account? <a id="authToggleLink">Sign in</a>`;
  document.getElementById("authToggleLink").addEventListener("click", ()=>authToggleLink.click());
  authError.textContent="";
});
authSubmitBtn.addEventListener("click", async ()=>{
  if(!sb){ authError.textContent="Supabase isn't configured yet - see SETUP_INSTRUCTIONS.md"; return; }
  authError.textContent="";
  const email=authEmail.value.trim(), password=authPassword.value;
  if(!email||!password){ authError.textContent="Enter both email and password."; return; }
  authSubmitBtn.disabled=true;
  try{
    if(authMode==="signin"){ const {error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error; }
    else { const {error}=await sb.auth.signUp({email,password}); if(error) throw error; authError.style.color="#2A7A4E"; authError.textContent="Account created. Check your email to confirm, then sign in."; }
  } catch(e){ authError.style.color=""; authError.textContent = e.message||"Something went wrong."; }
  finally { authSubmitBtn.disabled=false; }
});

/* ============ INIT ============ */
async function showApp(userId){
  currentUserId=userId; authScreen.style.display="none"; appRoot.style.display="flex";
  try{
    const saved = localStorage.getItem("fleethub_navstate");
    if(saved){
      const state = JSON.parse(saved);
      if(state.currentModule) currentModule = state.currentModule;
      if(state.currentExpenseTab) currentExpenseTab = state.currentExpenseTab;
      if(state.currentView) currentView = state.currentView;
    }
  } catch(e){ console.warn("Could not restore last page:", e); }
  const activeBtn = hamburgerMenu.querySelector(`button[data-module="${currentModule}"]`);
  (activeBtn || hamburgerMenu.querySelector('button[data-module="contracts"]')).classList.add("active");
  registerServiceWorker();
  await loadAll(); renderMain();
}
function showAuth(){ appRoot.style.display="none"; authScreen.style.display="flex"; }
if(sb){ sb.auth.onAuthStateChange((event,session)=>{ if(session&&session.user) showApp(session.user.id); else showAuth(); }); }
else { showAuth(); authError.textContent="Supabase isn't configured yet - see SETUP_INSTRUCTIONS.md"; }
window.addEventListener("beforeunload", ()=>{ if(autoSaveTimer){ saveAll(); } });
</script>

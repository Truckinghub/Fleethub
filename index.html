<style>
  :root{
    --charcoal:#1E2A38; --charcoal-light:#2C3B4E; --blue:#5B8DBE; --blue-light:#8FB4D9;
    --blue-pale:#E4EDF5; --copper:#C1703D; --bg:#F4F5F6; --card:#FFFFFF; --border:#E1E4E8;
    --text-muted:#6B7280; --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--charcoal); height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  header{background:var(--charcoal); color:#fff; display:flex; align-items:center; padding:10px 20px; gap:14px; flex-shrink:0; border-bottom:3px solid var(--copper); position:relative; flex-wrap:wrap;}
  header .logo-icon{width:40px;height:34px;flex-shrink:0;}
  .brand-home{display:flex; align-items:center; gap:14px; cursor:pointer; opacity:1; transition:opacity .15s;}
  .brand-home:hover{opacity:.85;}
  header .titles{display:flex; flex-direction:column; line-height:1.2;}
  header .titles .name{font-size:18px; font-weight:bold; letter-spacing:.5px;}
  header .titles .sub{font-size:10px; color:var(--blue-light); letter-spacing:1.2px;}
  header .titles .underline{width:100%; height:2px; background:var(--copper); margin-top:3px;}
  header .toolbar{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:6px; padding:9px 14px; font-size:13px; font-weight:bold; transition:opacity .15s;}
  button:hover{opacity:.88;} button:disabled{opacity:.35; cursor:not-allowed;}
  .btn-blue{background:var(--blue); color:#fff;} .btn-ghost{background:transparent; color:#fff; border:1px solid #445367;}
  .btn-sm{padding:6px 12px; font-size:12px;} .btn-danger{background:transparent; color:var(--danger); border:1px solid #E8B4AC; padding:6px 10px; font-size:12px;}
  .btn-success{background:transparent; color:#2A7A4E; border:1px solid #A9D6BC; padding:6px 10px; font-size:12px;}
  .hamburger-btn{background:transparent; color:#fff; border:1px solid #445367; padding:9px 12px; font-size:16px; line-height:1;}
  .hamburger-wrap{position:relative;}
  .hamburger-menu{position:absolute; top:calc(100% + 8px); right:0; background:var(--charcoal-light); border:1px solid #445367; border-radius:8px; min-width:190px; box-shadow:0 6px 18px rgba(0,0,0,.35); overflow:hidden; z-index:50;}
  .hamburger-menu.hidden{display:none;}
  .hamburger-menu button{display:block; width:100%; text-align:left; background:transparent; color:#D6D9DD; border-radius:0; padding:11px 16px; font-size:13px; font-weight:normal; border-bottom:1px solid #445367;}
  .hamburger-menu button:last-child{border-bottom:none;} .hamburger-menu button:hover{background:#37485D;}
  .hamburger-menu button.active{color:#fff; font-weight:bold; border-left:3px solid var(--blue); padding-left:13px;}
  .app-body{flex:1; display:flex; overflow:hidden; min-height:0;}
  main{flex:1; overflow-y:auto; padding:24px 30px; min-width:0;}
  .page-title{font-size:20px; font-weight:bold; margin:0 0 4px 0;}
  .page-title .clickable-title{cursor:pointer; text-decoration:underline; text-decoration-color:var(--blue); text-underline-offset:4px;}
  .page-title .clickable-title:hover{color:var(--blue);}
  .page-sub{font-size:12px; color:var(--text-muted); margin:0 0 20px 0;}
  .section-label{font-size:12px; font-weight:bold; color:var(--text-muted); text-transform:uppercase; letter-spacing:.6px; margin:22px 0 10px 0;}
  .section-label:first-of-type{margin-top:0;}
  .week-picker-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px;}
  .week-picker-row select{padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:#fff; font-size:14px; font-family:inherit; color:var(--charcoal); min-width:260px;}
  .week-picker-row select:focus{outline:none; border-color:var(--blue);}
  .inactive-toggle{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted);}
  .cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:16px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .card.company{background:var(--charcoal); border-color:var(--charcoal);}
  .card.company h3, .card.company .label{color:#D6D9DD;} .card.company .big{color:#fff;} .card.company h3 .tag{background:var(--blue);}
  .card.clickable{cursor:pointer; transition:box-shadow .15s, transform .15s;}
  .card.clickable:hover{box-shadow:0 4px 14px rgba(0,0,0,.1); transform:translateY(-1px);}
  .card h3{margin:0 0 12px 0; font-size:15px; display:flex; align-items:center; gap:8px;}
  .card h3 .tag{background:var(--charcoal); color:#fff; font-size:11px; padding:3px 9px; border-radius:20px;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:11px; color:var(--text-muted); margin-bottom:3px; font-weight:bold; text-transform:uppercase; letter-spacing:.4px;}
  .field input, .field select{width:100%; padding:9px 9px; border:1px solid var(--border); border-radius:5px; font-size:14px; font-family:inherit;}
  .field input:focus, .field select:focus{outline:none; border-color:var(--blue);}
  .field.readonly input{background:var(--blue-pale); font-weight:bold; color:var(--charcoal); border-color:#C7D9EB;}
  .blockgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .totalsrow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:6px; padding-top:10px; border-top:1px dashed var(--border);}
  .ytd-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px 16px;}
  .ytd-grid .metric{margin-bottom:0;}
  .summary-cards .card .big{font-size:20px; font-weight:bold; color:var(--charcoal); margin:2px 0 0 0;}
  .summary-cards .card .big.negative{color:var(--danger);}
  .summary-cards .card.company .big{color:#fff;}
  .summary-cards .card.company .big.negative{color:#FF9B8A;}
  .summary-cards .card .label{font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.3px;}
  .summary-cards .card.company .label{color:#B9C2CD;}
  .hint{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .banner{background:var(--blue-pale); border:1px solid #C7D9EB; color:#2A4E70; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px;}
  .banner b{display:block; margin-bottom:2px;} .banner.soon{background:#EDEFF1; border-color:var(--border); color:var(--text-muted);}
  .subtabs{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap;}
  .subtabs button{background:var(--card); color:var(--charcoal); border:1px solid var(--border); padding:8px 14px; font-size:12px; font-weight:bold;}
  .subtabs button.active{background:var(--charcoal); color:#fff; border-color:var(--charcoal);}
  table.logtable{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  table.logtable th{background:var(--charcoal); color:#fff; text-align:left; padding:10px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.4px;}
  table.logtable td{padding:6px 10px; border-top:1px solid var(--border); vertical-align:middle;}
  table.logtable td input, table.logtable td select{width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:5px; font-size:13px; font-family:inherit;}
  table.logtable td input:focus, table.logtable td select:focus{outline:none; border-color:var(--blue);}
  .addrow-wrap{margin-top:14px;}
  .fleet-section{margin-bottom:28px;}
  .fleet-add-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:flex-end;}
  .fleet-add-row .field{margin-bottom:0; flex:1; min-width:120px;}

  #authScreen{display:none; height:100%; align-items:center; justify-content:center; background:var(--bg); overflow-y:auto; padding:20px;}
  .auth-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:32px 28px; width:100%; max-width:360px; box-shadow:0 4px 24px rgba(0,0,0,.08);}
  .auth-card .logo-icon{width:60px; height:50px; display:block; margin:0 auto 10px auto;}
  .auth-card h1{font-size:20px; text-align:center; margin:0 0 2px 0; color:var(--charcoal);}
  .auth-card .tag-line{font-size:11px; text-align:center; color:var(--text-muted); letter-spacing:1px; margin-bottom:24px; text-transform:uppercase;}
  .auth-card .field{margin-bottom:14px;} .auth-card button.primary{width:100%; padding:11px; font-size:14px; margin-top:6px;}
  .auth-toggle{text-align:center; font-size:13px; color:var(--text-muted); margin-top:16px;}
  .auth-toggle a{color:var(--blue); cursor:pointer; font-weight:bold; text-decoration:none;}
  .auth-error{color:var(--danger); font-size:12px; margin-top:10px; text-align:center;}

  #statusToast{position:fixed; left:14px; bottom:14px; background:var(--charcoal); color:#fff; padding:8px 14px; border-radius:6px; font-size:12px; box-shadow:0 2px 10px rgba(0,0,0,.2); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s;}

  #appToastContainer{position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:2000; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; max-width:420px; padding:0 16px; pointer-events:none;}
  .app-toast{background:var(--charcoal); color:#fff; padding:12px 16px; border-radius:8px; font-size:13px; box-shadow:0 4px 16px rgba(0,0,0,.25); opacity:0; transform:translateY(-10px); transition:opacity .25s, transform .25s; pointer-events:auto; max-width:100%; word-break:break-word;}
  .app-toast.visible{opacity:1; transform:translateY(0);}
  .app-toast-success{background:#2A7A4E;}
  .app-toast-error{background:var(--danger);}
  .app-toast-warning{background:var(--copper);}
  #statusToast.visible{opacity:1;}

  @media (max-width: 760px){
    header{padding:10px 12px;} header .titles .sub{display:none;}
    header .toolbar{gap:6px;} header button{padding:10px 12px; font-size:13px; min-height:44px;}
    main{padding:16px;}
    .cards{grid-template-columns:1fr; gap:14px;} .blockgrid{grid-template-columns:1fr 1fr;}
    .totalsrow{grid-template-columns:1fr; gap:8px;}
    .ytd-grid{grid-template-columns:repeat(3, 1fr); gap:8px 10px;}
    .summary-cards .card .big{font-size:16px;}
    table.logtable{display:block; overflow-x:auto; white-space:nowrap;}
    .week-picker-row select{min-width:0; width:100%;}

    /* Prevent iOS Safari from zooming in on tap (triggers whenever a focused input's
       font-size is under 16px) and give every tappable control more room to hit. */
    .field input, .field select, table.logtable td input, table.logtable td select,
    .week-picker-row select, input[type="text"], input[type="number"], input[type="date"], input[type="email"], input[type="password"], select {
      font-size:16px !important;
    }
    button, .btn-sm{ min-height:44px; padding:11px 16px; }
    table.logtable td button{ min-height:40px; padding:8px 14px; }
    .hamburger-menu button{ min-height:48px; }
    .subtabs button{ min-height:42px; padding:10px 16px; }

    /* Checkboxes: native boxes are tiny touch targets by default - enlarge the box itself
       and give the whole label generous padding so the tap area extends well past the box. */
    .inactive-toggle{ padding:8px 4px; gap:10px; min-height:44px; }
    .inactive-toggle input[type="checkbox"]{ width:22px; height:22px; flex-shrink:0; }

    /* More breathing room between adjacent buttons (Take Photo / Upload File,
       View / Remove, etc.) so a slightly-off tap doesn't hit the wrong one. */
    .fleet-add-row{ gap:12px; }
    .fleet-add-row button{ width:100%; }
    table.logtable td{ padding:10px 12px; }
    [style*="gap:6px"]{ gap:12px !important; }
  }
</style>
</head>

<script>
const SUPABASE_URL = "https://fszqfhntaofgrompboap.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mIhle8vWmsYr5ELwStQs-g_OQs-84Jr";
const sb = (SUPABASE_URL.startsWith("http")) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ============ WEEK ENGINE ============ */
const ANCHOR_WEEK = 34;
const ANCHOR_SUNDAY_UTC = Date.UTC(2026, 7, 16);
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function weekSunday(week){ return new Date(ANCHOR_SUNDAY_UTC + (week-ANCHOR_WEEK)*7*86400000); }
function fmtShort(date){ return `${MONTH_NAMES[date.getUTCMonth()]} ${String(date.getUTCDate()).padStart(2,"0")}`; }
function weekDateRangeLabel(week){
  const sun = weekSunday(week); const sat = new Date(sun); sat.setUTCDate(sun.getUTCDate()+6);
  if(sun.getUTCFullYear() !== sat.getUTCFullYear()) return `${fmtShort(sun)}, ${sun.getUTCFullYear()} - ${fmtShort(sat)}, ${sat.getUTCFullYear()}`;
  return `${fmtShort(sun)} - ${fmtShort(sat)}, ${sat.getUTCFullYear()}`;
}
function buildWeekList(){
  const list=[]; let week=ANCHOR_WEEK; const yearEnd=Date.UTC(2026,11,31);
  while(true){ const sun=weekSunday(week); const sat=new Date(sun); sat.setUTCDate(sun.getUTCDate()+6); list.push(week); if(sat.getTime()>=yearEnd) break; week++; }
  return list;
}
const WEEKS = buildWeekList();
function groupWeeksByMonth(){
  const groups=[]; let current=null;
  WEEKS.forEach(w=>{
    const sun=weekSunday(w); const key=`${sun.getUTCFullYear()}-${sun.getUTCMonth()}`;
    if(!current || current.key!==key){ current={key, label:`${MONTH_NAMES[sun.getUTCMonth()]} ${sun.getUTCFullYear()}`, weeks:[]}; groups.push(current); }
    current.weeks.push(w);
  });
  return groups;
}

/* ============ APP STATE ============ */
let vehicles = [];   // {truckId, addedWeek, active, inspectionExpiration, inspectionCompleted, inspectionCost,
                      //  registrationExpiration, registrationCompleted, registrationCost,
                      //  hvut2290Expiration, hvut2290Completed, hvut2290Cost, hvut2290ReceiptPath,
                      //  insuranceMonthlyCost, hasBobtailInsurance, bobtailInsuranceCost}
let drivers = [];    // {name, active, licenseExpiration, licenseCompleted, licenseDocumentPath,
                      //  medicalCardExpiration, medicalCardCompleted, medicalCardDocumentPath, w9DocumentPath}
let iftaData = { year: 2026, q1Cost:"", q2Cost:"", q3Cost:"", q4Cost:"", q1Completed:false, q2Completed:false, q3Completed:false, q4Completed:false };
let contractsEntries = [];
let fuelEntries = [];
let payrollEntries = [];
let partsLog = [], mechanicLog = [], maintenanceLog = [];

let currentModule = "contracts";
let currentExpenseTab = "overview";
let currentView = { type:"summary" };
let unsaved = false;
let currentUserId = null;
let showInactive = false; // "show inactive too" toggle for week pages

function activeVehicles(){ return vehicles.filter(v=>v.active); }
function activeDrivers(){ return drivers.filter(d=>d.active); }
function vehiclesForWeek(week, includeInactive){
  return vehicles.filter(v => v.addedWeek<=week && (includeInactive || v.active));
}
function vehicleExists(truckId){ return vehicles.some(v=>v.truckId===truckId); }

function getContractEntry(week, truck){
  let e = contractsEntries.find(x=>x.week===week && x.truck===truck);
  if(!e){ e = { week, truck, contractId:"", blockRate:"", numBlocks:"", block1:"", block2:"", block3:"" }; contractsEntries.push(e); }
  return e;
}
function getFuelEntry(week, truck){
  let e = fuelEntries.find(x=>x.week===week && x.truck===truck);
  if(!e){ e = { week, truck, amount:"" }; fuelEntries.push(e); }
  return e;
}

/* ============ COMPUTE HELPERS ============
   Per-truck/per-driver breakdowns only include ACTIVE roster entries.
   Company-wide totals sum ALL historical entries regardless of active status,
   so tax/accounting totals never lose money just because a truck/driver was removed. */
function computeRow(truck, d){
  const rate=parseFloat(d.blockRate)||0, n=parseInt(d.numBlocks)||0;
  const contractRate=rate*n;
  const b1=parseFloat(d.block1)||0, b2=parseFloat(d.block2)||0, b3=parseFloat(d.block3)||0;
  const contractAcc=b1+b2+b3; const totalAcc=contractAcc-contractRate;
  return { truck, contractId:d.contractId||"", blockRate:d.blockRate||"", numBlocks:d.numBlocks||"",
    block1:d.block1||"", block2:d.block2||"", block3:d.block3||"", contractRate, contractAcc, totalAcc };
}

function computeAllTimeTotals(){
  const totals = activeVehicles().map(v=>{
    const truck=v.truckId;
    let grossContracts=0, grossContractsAcc=0, grossAcc=0;
    contractsEntries.filter(e=>e.truck===truck).forEach(e=>{
      const row=computeRow(truck,e);
      grossContracts+=row.contractRate; grossContractsAcc+=row.contractAcc; grossAcc+=row.totalAcc;
    });
    return { truck, grossContracts, grossContractsAcc, grossAcc };
  });
  let companyContracts=0, companyContractsAcc=0, companyAcc=0;
  contractsEntries.forEach(e=>{
    const row=computeRow(e.truck,e);
    companyContracts+=row.contractRate; companyContractsAcc+=row.contractAcc; companyAcc+=row.totalAcc;
  });
  return { totals, company:{ grossContracts:companyContracts, grossContractsAcc:companyContractsAcc, grossAcc:companyAcc } };
}

function computeFuelTotals(){
  const totals = activeVehicles().map(v=>{
    const truck=v.truckId;

function computeLogSummary(entries, summaryType){
  if(summaryType==="sum"){
    const sums={}; activeVehicles().forEach(v=>sums[v.truckId]=0);
    entries.forEach(e=>{ if(sums.hasOwnProperty(e.truck)) sums[e.truck]+=parseFloat(e.amount)||0; });
    const grand = entries.reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
    return { sums, grand };
  } else {
    const maxes={}; activeVehicles().forEach(v=>maxes[v.truckId]=0);
    entries.forEach(e=>{ if(maxes.hasOwnProperty(e.truck)) maxes[e.truck]=Math.max(maxes[e.truck], parseFloat(e.amount)||0); });
    return { maxes };
  }
}

/* ============ COMPLIANCE: dates, urgency, costs ============ */
function daysBetween(today, expDateStr){
  const exp = new Date(expDateStr + "T00:00:00Z");
  const t = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate()));
  return Math.round((exp - t) / 86400000);
}
function getComplianceUrgency(expDateStr, completed){
  if(!expDateStr) return { level:"none", daysUntil:null };
  const today = new Date();
  if(completed) return { level:"completed", daysUntil: daysBetween(today, expDateStr) };
  const d = daysBetween(today, expDateStr);
  if(d < 0) return { level:"expired", daysUntil:d };
  if(d <= 14) return { level:"due-soon", daysUntil:d };
  if(d <= 30) return { level:"upcoming", daysUntil:d };
  return { level:"ok", daysUntil:d };
}
function urgencyBadgeHTML(urgency){
  const labels = { none:"", ok:"OK", upcoming:"Upcoming", "due-soon":"Due Soon", expired:"EXPIRED", completed:"Completed" };
  const colors = { ok:"#2A7A4E", upcoming:"#B8860B", "due-soon":"#C1703D", expired:"#C0392B", completed:"#5B8DBE" };
  if(urgency.level==="none") return "";
  const dayTxt = urgency.daysUntil===null ? "" : (urgency.daysUntil>=0 ? ` (${urgency.daysUntil}d)` : ` (${Math.abs(urgency.daysUntil)}d overdue)`);
  return `<span style="display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:bold; color:#fff; background:${colors[urgency.level]||'#888'};">${labels[urgency.level]}${urgency.level!=='completed'?dayTxt:''}</span>`;
}

function computeOperationsCostTotal(){
  let total = 0;
  vehicles.forEach(v=>{
    total += parseFloat(v.inspectionCost)||0;
    total += parseFloat(v.registrationCost)||0;
    total += parseFloat(v.hvut2290Cost)||0;
    total += (parseFloat(v.insuranceMonthlyCost)||0) * 12;
    if(v.hasBobtailInsurance) total += (parseFloat(v.bobtailInsuranceCost)||0) * 12;
  });
  total += (parseFloat(iftaData.q1Cost)||0) + (parseFloat(iftaData.q2Cost)||0) + (parseFloat(iftaData.q3Cost)||0) + (parseFloat(iftaData.q4Cost)||0);
  return total;
}

function computeVehicleOperationsCost(v){
  let total = parseFloat(v.inspectionCost)||0;
  total += parseFloat(v.registrationCost)||0;
  total += parseFloat(v.hvut2290Cost)||0;
  total += (parseFloat(v.insuranceMonthlyCost)||0) * 12;
  if(v.hasBobtailInsurance) total += (parseFloat(v.bobtailInsuranceCost)||0) * 12;
  return total;
}

function computeDashboardYTD(){
  const contracts = computeAllTimeTotals();
  const fuel = computeFuelTotals();
  const parts = computeLogSummary(partsLog, "sum");
  const mechanic = computeLogSummary(mechanicLog, "sum");
  const payroll = computePayrollTotalsByTruck();

  const perTruck = activeVehicles().map((v,i)=>{
    const truck = v.truckId;
    const ytdContracts = contracts.totals[i].grossContracts;
    const ytdAccessories = contracts.totals[i].grossAcc;
    const ytdExpenses = (fuel.totals[i].total||0) + (parts.sums[truck]||0) + (mechanic.sums[truck]||0) + computeVehicleOperationsCost(v);
    const ytdPayroll = payroll.totals[i].total;
    const grossYTD = ytdContracts + ytdAccessories;
    const netYTD = grossYTD - ytdExpenses - ytdPayroll;
    return { truck, ytdContracts, ytdAccessories, ytdExpenses, ytdPayroll, grossYTD, netYTD };
  });

  const companyYtdContracts = contracts.company.grossContracts;
  const companyYtdAccessories = contracts.company.grossAcc;
  const companyYtdExpenses = fuel.company + parts.grand + mechanic.grand + computeOperationsCostTotal();
  const companyYtdPayroll = payroll.company;
  const companyGrossYTD = companyYtdContracts + companyYtdAccessories;
  const companyNetYTD = companyGrossYTD - companyYtdExpenses - companyYtdPayroll;
  const company = { ytdContracts:companyYtdContracts, ytdAccessories:companyYtdAccessories, ytdExpenses:companyYtdExpenses, ytdPayroll:companyYtdPayroll, grossYTD:companyGrossYTD, netYTD:companyNetYTD };

  return { perTruck, company };
}

/* ============ CRC32 / ZIP ENGINE ============ */
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function strToBytes(str){return new TextEncoder().encode(str);}
function concatBytes(arrays){let total=0;for(const a of arrays)total+=a.length;const out=new Uint8Array(total);let off=0;for(const a of arrays){out.set(a,off);off+=a.length;}return out;}
function u16(v){const b=new Uint8Array(2);new DataView(b.buffer).setUint16(0,v,true);return b;}
function u32(v){const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,v>>>0,true);return b;}
function buildZip(files){
  const localParts=[],centralParts=[];let offset=0;
  for(const f of files){
    const nameBytes=strToBytes(f.name),dataBytes=f.data,crc=crc32(dataBytes),size=dataBytes.length;
    const localHeader=concatBytes([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(size),u32(size),u16(nameBytes.length),u16(0),nameBytes]);
    localParts.push(localHeader,dataBytes);
    const centralHeader=concatBytes([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(size),u32(size),u16(nameBytes.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),nameBytes]);
    centralParts.push(centralHeader);
    offset+=localHeader.length+dataBytes.length;
  }
  const centralDir=concatBytes(centralParts),centralOffset=offset,centralSize=centralDir.length;
  const eocd=concatBytes([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(centralSize),u32(centralOffset),u16(0)]);
  return concatBytes([...localParts,centralDir,eocd]);
}

function numCell(ref,value,styleId){const s=styleId!==undefined?` s="${styleId}"`:"";const v=(value===""||value===null||value===undefined||isNaN(value))?"":value;if(v==="")return `<c r="${ref}"${s}/>`;return `<c r="${ref}"${s}><v>${v}</v></c>`;}

/* Excel export needs per-vehicle totals for ALL vehicles (including inactive), since the
   exported file is meant to be the complete historical record for tax purposes - unlike the
   app's own Dashboard, which only shows active vehicles in the per-truck breakdown. */
function computeAllVehiclesContractTotals(){
  return vehicles.map(v=>{
    const truck=v.truckId;
    let grossContracts=0, grossContractsAcc=0, grossAcc=0;
    contractsEntries.filter(e=>e.truck===truck).forEach(e=>{
      const row=computeRow(truck,e);
      grossContracts+=row.contractRate; grossContractsAcc+=row.contractAcc; grossAcc+=row.totalAcc;
    });
    return { truck, grossContracts, grossContractsAcc, grossAcc };
  });
}

    const rr = 5+idx;
    const total = payrollEntries.filter(e=>e.driver===d.name).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
    const f = `SUMIF(C${firstDataRow}:C${lastDataRow},"${d.name}",E${firstDataRow}:E${lastDataRow})`;
    xml += `<row r="${rr}">${inlineStrCell(`A${rr}`,d.name,0)}${formulaCell(`B${rr}`,f,total,1)}</row>`;
  });
  const compRow = 5+drivers.length;
  const total = payrollEntries.reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  xml += `<row r="${compRow}">${inlineStrCell(`A${compRow}`,"PAYROLL YTD",2)}${formulaCell(`B${compRow}`,`SUM(E${firstDataRow}:E${lastDataRow})`,total,1)}</row>`;

  const logHeaderRow = firstDataRow-1;
  xml += `<row r="${logHeaderRow}">${["Week","Date Range","Driver","Truck","Amount"].map((h,i)=>inlineStrCell(["A","B","C","D","E"][i]+logHeaderRow,h,2)).join("")}</row>`;
  for(let i=0;i<nRows;i++){
    const rr = firstDataRow+i;
    const e = payrollEntries[i] || {week:"",driver:"",truck:"",amount:""};
    const dateRange = e.week ? weekDateRangeLabel(e.week) : "";
    xml += `<row r="${rr}">`;
    xml += numCell(`A${rr}`, e.week, 0);
    xml += inlineStrCell(`B${rr}`, dateRange, 0);
    xml += inlineStrCell(`C${rr}`, e.driver, 0);
    xml += inlineStrCell(`D${rr}`, e.truck, 0);
    xml += numCell(`E${rr}`, e.amount, 1);
    xml += `</row>`;
  }
  xml += `</sheetData></worksheet>`;
  return xml;
}

function buildLogSheetXML(title, subtitle, colHeaders, fieldOrder, entries, summaryType){
  let xml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>`;
  xml += `<row r="1">${inlineStrCell("A1",title,3)}</row>`;
  xml += `<row r="2">${inlineStrCell("A2",subtitle,0)}</row>`;
  const nRows = Math.max(150, entries.length);
  const firstDataRow = 6 + vehicles.length + 1;
  const lastDataRow = firstDataRow + nRows - 1;

  if(summaryType==="sum"){
    xml += `<row r="4">${inlineStrCell("A4","Truck ID",2)}${inlineStrCell("B4","Total Paid",2)}</row>`;
    vehicles.forEach((v,idx)=>{
      const rr=5+idx;
      const total = entries.filter(e=>e.truck===v.truckId).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
      const f = `SUMIF(A${firstDataRow}:A${lastDataRow},"${v.truckId}",D${firstDataRow}:D${lastDataRow})`;
      xml += `<row r="${rr}">${inlineStrCell(`A${rr}`,v.truckId,0)}${formulaCell(`B${rr}`,f,total,1)}</row>`;
    });
    const compRow=5+vehicles.length;
    const grand = entries.reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
    xml += `<row r="${compRow}">${inlineStrCell(`A${compRow}`,"Grand Total",2)}${formulaCell(`B${compRow}`,`SUM(D${firstDataRow}:D${lastDataRow})`,grand,1)}</row>`;
  } else {
    xml += `<row r="4">${inlineStrCell("A4","Truck ID",2)}${inlineStrCell("B4","Latest Mileage",2)}</row>`;
    vehicles.forEach((v,idx)=>{
      const rr=5+idx;
      const entriesForTruck = entries.filter(e=>e.truck===v.truckId);
      const max = entriesForTruck.reduce((a,e)=>Math.max(a,parseFloat(e.amount)||0),0);
      const f = `SUMPRODUCT(MAX((A${firstDataRow}:A${lastDataRow}="${v.truckId}")*D${firstDataRow}:D${lastDataRow}))`;
      xml += `<row r="${rr}">${inlineStrCell(`A${rr}`,v.truckId,0)}${formulaCell(`B${rr}`,f,max,4)}</row>`;
    });
  }

  const logHeaderRow = firstDataRow-1;
  const logHeaders = ["Truck", colHeaders[0], colHeaders[1], colHeaders[2]];
  xml += `<row r="${logHeaderRow}">` + logHeaders.map((h,i)=>inlineStrCell(["A","B","C","D"][i]+logHeaderRow,h,2)).join("") + `</row>`;
  for(let i=0;i<nRows;i++){
    const rr = firstDataRow+i;
    const e = entries[i] || { truck:"", [fieldOrder[0]]:"", [fieldOrder[1]]:"", [fieldOrder[2]]:"" };
    xml += `<row r="${rr}">`;
    xml += inlineStrCell(`A${rr}`, e.truck||"", 0);
    const v0=e[fieldOrder[0]]||"", v1=e[fieldOrder[1]]||"", v2=e[fieldOrder[2]]||"";
    xml += inlineStrCell(`B${rr}`, v0, 0);
    xml += inlineStrCell(`C${rr}`, v1, 0);
    if(fieldOrder[2]==="amount") xml += numCell(`D${rr}`, v2, summaryType==="max"?4:1);
    else xml += inlineStrCell(`D${rr}`, v2, 0);
    xml += `</row>`;
  }
  xml += `</sheetData></worksheet>`;
  return xml;
}

function buildWorkbookBytes(){
  const sheetNames = ["Summary","Vehicles","Drivers","Fuel","Parts","Mechanic","Maintenance","Payroll", ...WEEKS.map(w=>`Week ${w}`)];
  const sheetXMLs = [];
  const { totals, company } = computeAllTimeTotals();
  const allVehicleTotals = computeAllVehiclesContractTotals();
  sheetXMLs.push(buildSummarySheetXML(allVehicleTotals.length ? allVehicleTotals : vehicles.map(v=>({truck:v.truckId, grossContracts:0, grossContractsAcc:0, grossAcc:0})), company));
  sheetXMLs.push(buildVehiclesSheetXML());
  sheetXMLs.push(buildDriversSheetXML());
  sheetXMLs.push(buildFuelSheetXML());
  sheetXMLs.push(buildLogSheetXML("FleetHub - Parts Expense Log","Parts purchased per truck.",["Date","Description","Price"],["date","description","amount"],partsLog,"sum"));
  sheetXMLs.push(buildLogSheetXML("FleetHub - Mechanic / Repair Log","Repairs paid per truck.",["Date","Description of Repair","Amount Paid"],["date","description","amount"],mechanicLog,"sum"));
  sheetXMLs.push(buildLogSheetXML("FleetHub - Maintenance Records","Service history per truck.",["Description","Date","Mileage"],["description","date","amount"],maintenanceLog,"max"));
  sheetXMLs.push(buildPayrollSheetXML());
  WEEKS.forEach(w=>{
    const rows = vehiclesForWeek(w, true).map(v=>computeRow(v.truckId, getContractEntry(w, v.truckId)));
    sheetXMLs.push(buildWeekSheetXML(w, weekDateRangeLabel(w), rows));
  });

  const files=[];
  files.push({name:"[Content_Types].xml", data:strToBytes(buildContentTypesXML(sheetNames.length))});
  files.push({name:"_rels/.rels", data:strToBytes(buildRootRelsXML())});
  files.push({name:"xl/workbook.xml", data:strToBytes(buildWorkbookXML(sheetNames))});
  files.push({name:"xl/_rels/workbook.xml.rels", data:strToBytes(buildWorkbookRelsXML(sheetNames.length))});
  files.push({name:"xl/styles.xml", data:strToBytes(buildStylesXML())});
  sheetXMLs.forEach((xml,i)=>{ files.push({name:`xl/worksheets/sheet${i+1}.xml`, data:strToBytes(xml)}); });
  return buildZip(files);
}

function exportExcel(){
  const bytes = buildWorkbookBytes();
  const blob = new Blob([bytes], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="FleetHub_Export.xlsx";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

let autoSaveTimer = null;
function scheduleAutoSave(){
  if(autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(()=>{ autoSaveTimer=null; saveAll(); }, 1500);
}
function flushIfNeeded(){
  if(autoSaveTimer){ clearTimeout(autoSaveTimer); autoSaveTimer=null; saveAll(); }
}
function markUnsaved(){ unsaved=true; setStatus("Unsaved changes..."); scheduleAutoSave(); }
function markSaved(){ unsaved=false; setStatus(""); }
function setStatus(msg){
  const el = document.getElementById("statusToast");
  el.textContent = msg;
  el.classList.toggle("visible", !!msg);
}

/* In-app toast notifications - replaces native browser alert() popups so messages
   show up inside the site itself instead of a separate browser dialog. */
function showAppToast(message, type){
  const container = document.getElementById("appToastContainer");
  if(!container){ console.log(`[${type}]`, message); return; }
  const toast = document.createElement("div");
  toast.className = `app-toast app-toast-${type||'info'}`;
  toast.textContent = message;
  container.appendChild(toast);
  requestAnimationFrame(()=> toast.classList.add("visible"));
  const duration = type==="error" ? 6000 : 4500;
  setTimeout(()=>{
    toast.classList.remove("visible");
    setTimeout(()=>{ if(toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
  }, duration);
}

function imgToCanvas(img){
  const c = document.createElement("canvas");
  c.width = img.naturalWidth || img.width;
  c.height = img.naturalHeight || img.height;
  c.getContext("2d").drawImage(img, 0, 0);
  return c;
}

function detectInitialCorners(img){
  try{
    const scanner = new window.jscanify();
    const contour = scanner.findPaperContour(imgToCanvas(img));
    if(!contour) return null;
    const corners = scanner.getCornerPoints(contour);
    contour.delete && contour.delete();
    if(!corners || !corners.topLeftCorner) return null;
    return corners;
  } catch(e){
    console.warn("Auto edge-detection failed, falling back to default corners:", e);
    return null;
  }
}

/* Description auto-extraction (guessing the vendor, or later the line items) was tried
   and tested well on synthetic and even several real invoices, but proved unreliable
   across the fuller range of real-world receipts/invoices in practice. Dialing scanning
   back to just date + total, which are both consistently accurate, and leaving the
   description for the person to type themselves. */
function parseReceiptText(text){
  const lines = text.split("\n").map(l=>l.trim()).filter(l=>l.length>0);

  const amountRegex = /\$?\s?(\d{1,3}(?:,\d{3})*\.\d{2})/g;
  let bestAmount = "", totalLineAmount = null, allAmounts = [];
  for(const line of lines){
    const lower = line.toLowerCase();
    let m;
    const re = new RegExp(amountRegex);
    while((m = re.exec(line)) !== null){
      const val = parseFloat(m[1].replace(/,/g,""));
      allAmounts.push(val);
      if(lower.includes("total") && !lower.includes("subtotal")) totalLineAmount = val;
    }
  }
  if(totalLineAmount !== null) bestAmount = totalLineAmount.toFixed(2);
  else if(allAmounts.length) bestAmount = Math.max(...allAmounts).toFixed(2);

  const MONTH_ABBR = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  let foundDate = "";
  const datePatterns = [
    { re:/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/, fmt:m=>`${m[3]}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}` },
    { re:/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/, fmt:m=>`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}` },
    { re:/(\d{1,2})[\-\/\s]([a-zA-Z]{3})[\-\/\s](\d{2,4})/, fmt:m=>{
        const mon = MONTH_ABBR[m[2].toLowerCase()];
        if(!mon) return null;
        let yr = m[3];
        if(yr.length===2) yr = (parseInt(yr)<70?"20":"19")+yr;
        return `${yr}-${String(mon).padStart(2,"0")}-${m[1].padStart(2,"0")}`;
      } },
  ];
  for(const line of lines){
    for(const p of datePatterns){ const m=line.match(p.re); if(m){ const f=p.fmt(m); if(f){ foundDate=f; break; } } }
    if(foundDate) break;
  }

  return { amount:bestAmount, date:foundDate, description:"" };
}

function warpPerspectiveCrop(img, corners){
  const src = window.cv.imread(imgToCanvas(img));
  const widthTop = Math.hypot(corners.tr.x-corners.tl.x, corners.tr.y-corners.tl.y);
  const widthBottom = Math.hypot(corners.br.x-corners.bl.x, corners.br.y-corners.bl.y);
  const maxWidth = Math.max(widthTop, widthBottom, 50);
  const heightLeft = Math.hypot(corners.bl.x-corners.tl.x, corners.bl.y-corners.tl.y);
  const heightRight = Math.hypot(corners.br.x-corners.tr.x, corners.br.y-corners.tr.y);
  const maxHeight = Math.max(heightLeft, heightRight, 50);

  const dstCanvas = document.createElement("canvas");
  dstCanvas.width = maxWidth; dstCanvas.height = maxHeight;

  const dst = new window.cv.Mat();
  const dsize = new window.cv.Size(maxWidth, maxHeight);
  const srcTri = window.cv.matFromArray(4, 1, window.cv.CV_32FC2, [
    corners.tl.x, corners.tl.y, corners.tr.x, corners.tr.y,
    corners.br.x, corners.br.y, corners.bl.x, corners.bl.y
  ]);
  const dstTri = window.cv.matFromArray(4, 1, window.cv.CV_32FC2, [
    0,0, maxWidth,0, maxWidth,maxHeight, 0,maxHeight
  ]);
  const M = window.cv.getPerspectiveTransform(srcTri, dstTri);
  window.cv.warpPerspective(src, dst, M, dsize, window.cv.INTER_LINEAR, window.cv.BORDER_CONSTANT, new window.cv.Scalar());
  window.cv.imshow(dstCanvas, dst);

  src.delete(); dst.delete(); M.delete(); srcTri.delete(); dstTri.delete();
  return dstCanvas;
}

/* Shows the drag-to-adjust corner overlay for ANY page source (photo or PDF-rendered page).
   Returns a Promise resolving to the cropped canvas, or null if the user cancelled.
   Decoupled from OCR/upload entirely - the caller decides what to do with the result,
   which is what makes the multi-page capture loop below possible. */
/* Applies a document-scanner-style look, following the same pattern real scanning apps
   (Adobe Scan, Microsoft Lens) use: a small set of filter presets plus a contrast control,
   rather than a full photo-editing suite. */
function applyScanFilter(sourceCanvas, mode, contrast){
  const w = sourceCanvas.width, h = sourceCanvas.height;
  const out = document.createElement("canvas");
  out.width = w; out.height = h;
  const ctx = out.getContext("2d");
  ctx.drawImage(sourceCanvas, 0, 0);
  if(mode === "color") return out;

  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const c = Math.max(-255, Math.min(255, contrast));
  const contrastFactor = (259*(c+255)) / (255*(259-c));
  for(let i=0; i<data.length; i+=4){
    let gray = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
    gray = contrastFactor*(gray-128) + 128;
    if(mode === "bw"){
      gray = gray > 128 ? 255 : 0;
    } else {
      gray = Math.max(0, Math.min(255, gray));
    }
    data[i] = data[i+1] = data[i+2] = gray;
  }
  ctx.putImageData(imgData, 0, 0);
  return out;
}

/* Filter/contrast step shown right after cropping - lets the scan look like a real
   black-and-white document scan (the default), with Grayscale and Color as alternatives,
   plus a contrast slider to fine-tune it. Returns the finished canvas to use. */
function openFilterAdjustOverlay(sourceCanvas){
  return new Promise((resolve)=>{
    let mode = "bw", contrast = 40;

    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:1500; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px;";

    const maxW = Math.min(window.innerWidth - 32, 480);
    const maxHAvail = window.innerHeight - 260;
    const scale = Math.min(1, maxW/sourceCanvas.width, maxHAvail/sourceCanvas.height);
    const dispW = sourceCanvas.width*scale, dispH = sourceCanvas.height*scale;

    const previewCanvas = document.createElement("canvas");
    previewCanvas.width = dispW; previewCanvas.height = dispH;
    previewCanvas.style.cssText = "border-radius:8px; max-width:100%; background:#fff;";
    overlay.appendChild(previewCanvas);

    const controls = document.createElement("div");
    controls.style.cssText = "margin-top:16px; width:100%; max-width:480px;";
    controls.innerHTML = `
      <div style="display:flex; gap:8px; justify-content:center; margin-bottom:14px;">
        <button class="btn-sm" data-mode="color" style="background:#fff; color:#1E2A38; min-height:44px; flex:1;">Color</button>
        <button class="btn-sm" data-mode="grayscale" style="background:#fff; color:#1E2A38; min-height:44px; flex:1;">Grayscale</button>
        <button class="btn-sm" data-mode="bw" style="background:#5B8DBE; color:#fff; min-height:44px; flex:1;">B&amp;W</button>
      </div>
      <label style="color:#fff; font-size:12px; display:block; margin-bottom:8px; text-align:center;">Contrast</label>
      <input type="range" id="contrastSlider" min="-100" max="150" value="40" style="width:100%; margin-bottom:16px; min-height:32px;">
      <div style="display:flex; gap:10px; justify-content:center;">
        <button class="btn-blue" id="filterUseBtn" style="min-height:44px; flex:1;">Use This Scan</button>
        <button class="btn-danger" id="filterCancelBtn" style="min-height:44px; flex:1;">Skip Filter</button>
      </div>
    `;
    overlay.appendChild(controls);
    document.body.appendChild(overlay);

    function redraw(){
      const filtered = applyScanFilter(sourceCanvas, mode, contrast);
      const ctx = previewCanvas.getContext("2d");
      ctx.clearRect(0, 0, dispW, dispH);
      ctx.drawImage(filtered, 0, 0, dispW, dispH);
    }
    redraw();

    controls.querySelectorAll("[data-mode]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        mode = btn.dataset.mode;
        controls.querySelectorAll("[data-mode]").forEach(b=>{ b.style.background="#fff"; b.style.color="#1E2A38"; });
        btn.style.background = "#5B8DBE"; btn.style.color = "#fff";
        redraw();
      });
    });
    document.getElementById("contrastSlider").addEventListener("input", (e)=>{
      contrast = parseInt(e.target.value);
      redraw();
    });
    document.getElementById("filterUseBtn").addEventListener("click", ()=>{
      const finalCanvas = applyScanFilter(sourceCanvas, mode, contrast);
      document.body.removeChild(overlay);
      resolve(finalCanvas);
    });
    document.getElementById("filterCancelBtn").addEventListener("click", ()=>{
      document.body.removeChild(overlay);
      resolve(sourceCanvas);
    });
  });
}

function openCornerAdjustOverlay(img){
  return new Promise((resolve)=>{
    let corners = detectInitialCorners(img);
    if(!corners){
      const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      corners = {
        topLeftCorner: {x:w*0.08, y:h*0.08}, topRightCorner: {x:w*0.92, y:h*0.08},
        bottomLeftCorner: {x:w*0.08, y:h*0.92}, bottomRightCorner: {x:w*0.92, y:h*0.92}
      };
    }

    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px;";

    const imgW = img.naturalWidth || img.width, imgH = img.naturalHeight || img.height;
    const maxW = Math.min(window.innerWidth - 32, 700);
    const maxHAvail = window.innerHeight - 140;
    const scale = Math.min(1, maxW / imgW, maxHAvail / imgH);
    const dispW = imgW * scale, dispH = imgH * scale;

    const canvas = document.createElement("canvas");
    canvas.width = dispW; canvas.height = dispH;
    canvas.style.cssText = "touch-action:none; border-radius:8px; max-width:100%;";
    overlay.appendChild(canvas);

    const hint = document.createElement("div");
    hint.textContent = "Drag the corners to match the page's edges, then confirm.";
    hint.style.cssText = "color:#fff; font-size:13px; margin-top:12px; text-align:center;";
    overlay.appendChild(hint);

    const btnRow = document.createElement("div");
    btnRow.style.cssText = "margin-top:14px; display:flex; gap:10px;";
    const confirmBtn = document.createElement("button"); confirmBtn.textContent = "Confirm Crop"; confirmBtn.className = "btn-blue";
    const cancelBtn = document.createElement("button"); cancelBtn.textContent = "Cancel"; cancelBtn.className = "btn-danger";
    btnRow.appendChild(confirmBtn); btnRow.appendChild(cancelBtn);
    overlay.appendChild(btnRow);
    document.body.appendChild(overlay);

    let pts = {
      tl: { x: corners.topLeftCorner.x*scale, y: corners.topLeftCorner.y*scale },
      tr: { x: corners.topRightCorner.x*scale, y: corners.topRightCorner.y*scale },
      bl: { x: corners.bottomLeftCorner.x*scale, y: corners.bottomLeftCorner.y*scale },
      br: { x: corners.bottomRightCorner.x*scale, y: corners.bottomRightCorner.y*scale },
    };

    const ctx = canvas.getContext("2d");
    function draw(){
      ctx.clearRect(0,0,dispW,dispH);
      ctx.drawImage(img, 0,0,dispW,dispH);
      ctx.strokeStyle = "#C1703D"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(pts.tl.x,pts.tl.y); ctx.lineTo(pts.tr.x,pts.tr.y);
      ctx.lineTo(pts.br.x,pts.br.y); ctx.lineTo(pts.bl.x,pts.bl.y); ctx.closePath();
      ctx.stroke();
      Object.values(pts).forEach(p=>{
        ctx.beginPath(); ctx.arc(p.x,p.y,16,0,2*Math.PI);
        ctx.fillStyle = "#5B8DBE"; ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
      });
    }
    draw();

    let activeKey = null;
    function getPos(e){
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (clientX-rect.left) * (dispW/rect.width), y: (clientY-rect.top) * (dispH/rect.height) };
    }
    function findNearest(pos){
      let nearest=null, minDist=Infinity;
      Object.keys(pts).forEach(k=>{
        const d = Math.hypot(pts[k].x-pos.x, pts[k].y-pos.y);
        if(d<minDist){ minDist=d; nearest=k; }
      });
      return minDist < 56 ? nearest : null;
    }
    function startDrag(e){ activeKey = findNearest(getPos(e)); }
    function moveDrag(e){
      if(!activeKey) return;
      e.preventDefault();
      const pos = getPos(e);
      pts[activeKey] = { x: Math.max(0,Math.min(dispW,pos.x)), y: Math.max(0,Math.min(dispH,pos.y)) };
      draw();
    }
    function endDrag(){ activeKey = null; }
    canvas.addEventListener("mousedown", startDrag);
    canvas.addEventListener("mousemove", moveDrag);
    window.addEventListener("mouseup", endDrag);
    canvas.addEventListener("touchstart", startDrag, {passive:false});
    canvas.addEventListener("touchmove", moveDrag, {passive:false});
    canvas.addEventListener("touchend", endDrag);

    cancelBtn.addEventListener("click", ()=>{
      document.body.removeChild(overlay);
      resolve(null);
    });

    confirmBtn.addEventListener("click", ()=>{
      confirmBtn.disabled = true; confirmBtn.textContent = "Processing...";
      try{
        const orig = {
          tl: { x: pts.tl.x/scale, y: pts.tl.y/scale }, tr: { x: pts.tr.x/scale, y: pts.tr.y/scale },
          bl: { x: pts.bl.x/scale, y: pts.bl.y/scale }, br: { x: pts.br.x/scale, y: pts.br.y/scale },
        };
        const croppedCanvas = warpPerspectiveCrop(img, orig);
        document.body.removeChild(overlay);
        resolve(croppedCanvas);
      } catch(e){
        console.error(e);
        showAppToast("Couldn't process the crop: " + (e.message||e), "error");
        document.body.removeChild(overlay);
        resolve(null);
      }
    });
  });
}

let pdfJsLoadPromise = null;
function ensurePdfJsLoaded(){
  if(window.pdfjsLib) return Promise.resolve();
  if(pdfJsLoadPromise) return pdfJsLoadPromise;
  pdfJsLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
    script.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      resolve();
    };
    script.onerror = () => reject(new Error("Could not load the PDF reader. Check your internet connection."));
    document.head.appendChild(script);
  });
  return pdfJsLoadPromise;
}

async function renderPdfFirstPageToCanvas(file){
  await ensurePdfJsLoaded();
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 3 });
  const canvas = document.createElement("canvas");
  canvas.width = viewport.width; canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  return canvas;
}

/* Reads the PDF's actual embedded text layer directly, when it has one (i.e. it's a real
   digital PDF, not a scanned photo saved as a PDF). This is far more accurate than
   rendering to an image and running OCR on it, since there's zero recognition error -
   every character is exactly what the PDF says. Reconstructs reading order from each
   text item's x/y position, since getTextContent() doesn't guarantee line order.
   Returns "" if the PDF has no meaningful text layer (a scanned/image-only PDF), so the
   caller knows to fall back to the OCR pipeline instead. */
async function extractPdfTextLayer(file){
  await ensurePdfJsLoaded();
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const content = await page.getTextContent();
  if(!content.items.length) return "";

  const rows = [];
  const tolerance = 3;
  content.items.forEach(item => {
    const x = item.transform[4], y = item.transform[5];
    let row = rows.find(r => Math.abs(r.y - y) < tolerance);
    if(!row){ row = { y, items: [] }; rows.push(row); }
    row.items.push({ x, str: item.str });
  });
  rows.sort((a,b) => b.y - a.y);
  return rows.map(r => r.items.sort((a,b)=>a.x-b.x).map(i=>i.str).join(" ").trim()).filter(l=>l.length>0).join("\n");
}

function isPdfFile(file){
  return file.type === "application/pdf" || /\.pdf$/i.test(file.name || "");
}

/* ============ RECEIPT STORAGE (Supabase Storage) ============ */
function canvasToBlob(canvas, type, quality){
  return new Promise(resolve => canvas.toBlob(resolve, type, quality));
}

async function uploadReceiptImage(canvas){
  if(!sb || !currentUserId) return null;
  try{
    const blob = await canvasToBlob(canvas, "image/jpeg", 0.85);
    const path = `${currentUserId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const { error } = await sb.storage.from("receipts").upload(path, blob, { contentType: "image/jpeg" });
    if(error){ console.error("Receipt upload failed:", error); return null; }
    return path;
  } catch(e){
    console.error("Receipt upload failed:", e);
    return null;
  }
}

async function getReceiptSignedUrl(path){
  if(!sb || !path) return null;
  try{
    const { data, error } = await sb.storage.from("receipts").createSignedUrl(path, 3600);
    if(error){ console.error(error); return null; }
    return data.signedUrl;
  } catch(e){ console.error(e); return null; }
}

/* receiptPath can hold multiple pages, comma-separated. Helpers to work with that list. */
function receiptPathList(receiptPath){
  return (receiptPath||"").split(",").map(p=>p.trim()).filter(p=>p);
}

/* In-site document preview - shows the image/PDF right in the page instead of opening
   a new browser tab, with Download and Delete (behind a confirmation step) actions.
   onDelete, if provided, is called after the file is actually removed from storage so
   the caller can clear whatever field(s) referenced it. */
async function openDocumentPreviewModal(pathOrPaths, onDelete){
  const paths = Array.isArray(pathOrPaths) ? pathOrPaths : receiptPathList(pathOrPaths);
  if(!paths.length){ showAppToast("No document found for this entry.", "warning"); return; }

  const urls = await Promise.all(paths.map(p=>getReceiptSignedUrl(p)));
  const isPdfPath = (p) => /\.pdf$/i.test(p);

  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:1500; display:flex; align-items:center; justify-content:center; padding:16px;";
  const box = document.createElement("div");
  box.style.cssText = "background:#fff; border-radius:12px; padding:20px; max-width:600px; width:100%; max-height:90vh; display:flex; flex-direction:column;";

  let previewHtml = `<h3 style="margin:0 0 12px 0; color:var(--charcoal);">Document Preview</h3><div style="flex:1; overflow:auto; margin-bottom:14px; max-height:65vh;">`;
  paths.forEach((p,i)=>{
    const url = urls[i];
    if(!url){ previewHtml += `<p class="hint">Could not load this page.</p>`; return; }
    previewHtml += isPdfPath(p)
      ? `<iframe src="${url}" style="width:100%; height:60vh; border:1px solid var(--border); border-radius:8px; margin-bottom:10px;"></iframe>`
      : `<img src="${url}" style="width:100%; border-radius:8px; margin-bottom:10px; display:block;">`;
  });
  previewHtml += `</div><div id="docPreviewActions" style="display:flex; gap:8px; flex-wrap:wrap;">
    <button class="btn-blue btn-sm" id="docPreviewDownload">Download</button>
    <button class="btn-danger btn-sm" id="docPreviewDelete">Delete</button>
    <button class="btn-ghost btn-sm" id="docPreviewClose" style="background:var(--charcoal); margin-left:auto;">Close</button>
  </div>`;
  box.innerHTML = previewHtml;
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  document.getElementById("docPreviewClose").addEventListener("click", ()=>{ document.body.removeChild(overlay); });

  document.getElementById("docPreviewDownload").addEventListener("click", ()=>{
    paths.forEach((p,i)=>{
      const url = urls[i]; if(!url) return;
      const a = document.createElement("a");
      a.href = url; a.download = p.split("/").pop(); a.target="_blank"; a.rel="noopener";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });
  });

  document.getElementById("docPreviewDelete").addEventListener("click", ()=>{
    const actionsDiv = document.getElementById("docPreviewActions");
    actionsDiv.innerHTML = `<div style="width:100%;">
      <p style="color:var(--danger); font-weight:bold; margin:0 0 10px 0;">Delete this document? This cannot be undone.</p>
      <div style="display:flex; gap:8px;">
        <button class="btn-danger btn-sm" id="docPreviewDeleteConfirm">Yes, Delete</button>
        <button class="btn-ghost btn-sm" id="docPreviewDeleteCancel" style="background:var(--charcoal);">Cancel</button>
      </div></div>`;
    document.getElementById("docPreviewDeleteConfirm").addEventListener("click", async ()=>{
      try{ if(sb) await sb.storage.from("receipts").remove(paths); } catch(e){ console.error(e); }
      document.body.removeChild(overlay);
      if(onDelete) onDelete();
      showAppToast("Document deleted.", "success");
    });
    document.getElementById("docPreviewDeleteCancel").addEventListener("click", ()=>{
      document.body.removeChild(overlay);
      openDocumentPreviewModal(pathOrPaths, onDelete);
    });
  });
}

/* Opens the file/camera picker once and resolves with the chosen file, or null if cancelled. */
function pickReceiptFile(mode){
  return new Promise((resolve)=>{
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*,application/pdf";
    if(mode === "camera") input.capture = "environment";
    input.addEventListener("change", ()=>{ resolve(input.files[0] || null); });
    input.addEventListener("cancel", ()=>resolve(null));
    input.click();
  });
}

async function runOcrOnPages(pages, cfg, scanBtn, originalText, selectedTruck){
  if(scanBtn) scanBtn.textContent = "Scanning...";
  try{
    await ensureTesseractLoaded();
    let combinedText = "";
    const receiptPaths = [];
    for(const page of pages){
      if(page.knownText){
        // Real PDF text layer already extracted - skip OCR entirely for this page (faster and more accurate).
        combinedText += page.knownText + "\n";
      } else {
        const result = await window.Tesseract.recognize(page.canvas, "eng");
        combinedText += result.data.text + "\n";
      }
      const path = await uploadReceiptImage(page.canvas);
      if(path) receiptPaths.push(path);
    }
    const parsed = parseReceiptText(combinedText);
    const entries = getLogArray(cfg.key);
    const blank = { truck: selectedTruck || "", receiptPath: receiptPaths.join(",") };
    blank[cfg.fieldOrder[0]] = cfg.fieldOrder[0]==="date" ? parsed.date : parsed.description;
    blank[cfg.fieldOrder[1]] = cfg.fieldOrder[1]==="description" ? parsed.description : (cfg.fieldOrder[1]==="date" ? parsed.date : "");
    blank[cfg.fieldOrder[2]] = parsed.amount;
    entries.push(blank);
    markUnsaved();
    renderMain();
    setTimeout(()=>{ showAppToast("Receipt scanned - date and total filled in. Add a description and pick the truck below.", "success"); }, 100);
  } catch(e){
    console.error(e);
    showAppToast("Couldn't read that receipt: " + (e.message||e), "error");
  } finally {
    if(scanBtn){ scanBtn.disabled=false; scanBtn.textContent=originalText; }
  }
}

async function scanReceiptForLog(cfg, mode){
  const selectedTruck = await promptVehicleSelection();
  if(!selectedTruck) return;

  const btnId = mode === "camera" ? "takePhotoBtn" : "uploadFileBtn";
  const scanBtn = document.getElementById(btnId);
  const originalText = scanBtn ? scanBtn.textContent : "";
  if(scanBtn){ scanBtn.disabled=true; }

  const capturedPages = []; // {canvas, knownText}
  try{
    let keepGoing = true;
    while(keepGoing){
      if(scanBtn) scanBtn.textContent = "Loading...";
      const file = await pickReceiptFile(mode);
      if(!file){
        if(capturedPages.length === 0){ if(scanBtn){ scanBtn.disabled=false; scanBtn.textContent=originalText; } return; }
        break; // user cancelled the picker on a later page - proceed with what we have
      }

      if(isPdfFile(file)){
        if(scanBtn) scanBtn.textContent = "Reading PDF...";
        const textLayer = await extractPdfTextLayer(file);
        const pageImg = await renderPdfFirstPageToCanvas(file); // still needed as the viewable/stored receipt image
        if(textLayer && textLayer.replace(/\s/g,"").length > 20){
          // Real digital PDF with an actual text layer - use it directly, no OCR, no corner-adjust needed
          // (a rendered PDF page is already a clean rectangle, unlike a photo of a physical receipt).
          capturedPages.push({ canvas: pageImg, knownText: textLayer });
        } else {
          // Scanned/image-only PDF (no usable text layer) - treat like a photo: adjust corners, then OCR.
          const cropped = await openCornerAdjustOverlay(pageImg);
          if(cropped){
            const filtered = await openFilterAdjustOverlay(cropped);
            capturedPages.push({ canvas: filtered, knownText: null });
          }
        }
      } else {
        await ensureOpenCvLoaded();
        await ensureJscanifyLoaded();
        const pageImg = await loadImageFromFile(file);
        const cropped = await openCornerAdjustOverlay(pageImg);
        if(cropped){
          const filtered = await openFilterAdjustOverlay(cropped);
          capturedPages.push({ canvas: filtered, knownText: null });
        }
      }

      if(capturedPages.length === 0){ if(scanBtn){ scanBtn.disabled=false; scanBtn.textContent=originalText; } return; }

      keepGoing = await promptAddAnotherPage(capturedPages.length);
    }
    await runOcrOnPages(capturedPages, cfg, scanBtn, originalText, selectedTruck);
  } catch(e){
    console.error(e);
    showAppToast("Couldn't start the scanner: " + (e.message||e), "error");
    if(scanBtn){ scanBtn.disabled=false; scanBtn.textContent=originalText; }
  }
}

function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0;i<rawData.length;i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function registerServiceWorker(){
  if(!("serviceWorker" in navigator)) return null;
  try{ return await navigator.serviceWorker.register("sw.js"); }
  catch(e){ console.warn("Service worker registration failed:", e); return null; }
}

async function getPushSubscriptionStatus(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)) return "unsupported";
  const reg = await navigator.serviceWorker.getRegistration();
  if(!reg) return "not-registered";
  const sub = await reg.pushManager.getSubscription();
  return sub ? "subscribed" : "not-subscribed";
}

async function enablePushNotifications(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)){
    showAppToast("Push notifications aren't supported in this browser/app.", "error");
    return false;
  }
  try{
    const permission = await Notification.requestPermission();
    if(permission !== "granted"){ showAppToast("Notification permission was not granted.", "warning"); return false; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const subJson = sub.toJSON();
    if(sb && currentUserId){
      await sb.from("push_subscriptions").delete().eq("user_id", currentUserId).eq("endpoint", subJson.endpoint);
      await sb.from("push_subscriptions").insert({
        user_id: currentUserId, endpoint: subJson.endpoint,
        p256dh: subJson.keys.p256dh, auth: subJson.keys.auth
      });
    }
    return true;
  } catch(e){
    console.error(e);
    showAppToast("Could not enable notifications: " + (e.message||e), "error");
    return false;
  }
}

async function disablePushNotifications(){
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    if(!reg) return;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      if(sb && currentUserId){ await sb.from("push_subscriptions").delete().eq("user_id", currentUserId).eq("endpoint", endpoint); }
    }
  } catch(e){ console.error(e); }

async function uploadComplianceDocument(pathPrefix, mode){
  const file = await pickReceiptFile(mode==="camera" ? "camera" : "upload");
  if(!file) return null;
  if(!sb || !currentUserId){ showAppToast("Not connected.", "error"); return null; }

  try{
    if(isPdfFile(file)){
      // PDFs are already flat digital documents - no need to crop/filter, just upload as-is.
      const path = `${currentUserId}/${pathPrefix}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.pdf`;
      const { error } = await sb.storage.from("receipts").upload(path, file, { contentType: "application/pdf" });
      if(error){ console.error(error); showAppToast("Upload failed: " + error.message, "error"); return null; }
      return path;
    }

    // Photo or image upload: same corner-adjust + B&W/contrast pipeline as receipt scanning.
    await ensureOpenCvLoaded();
    await ensureJscanifyLoaded();
    const img = await loadImageFromFile(file);
    const cropped = await openCornerAdjustOverlay(img);
    if(!cropped) return null; // user cancelled the crop step
    const filtered = await openFilterAdjustOverlay(cropped);

    const blob = await canvasToBlob(filtered, "image/jpeg", 0.85);
    const path = `${currentUserId}/${pathPrefix}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const { error } = await sb.storage.from("receipts").upload(path, blob, { contentType: "image/jpeg" });
    if(error){ console.error(error); showAppToast("Upload failed: " + error.message, "error"); return null; }
    return path;
  } catch(e){
    console.error(e);
    showAppToast("Upload failed: " + (e.message||e), "error");
    return null;
  }
}

/* Re-renders the current page while preserving scroll position - a plain re-render
   (mainArea.innerHTML = ...) always snaps scroll back to the top, which on a long page
   like Compliance makes it feel like "the page won't scroll" every time you edit a field. */
function rerenderPreservingScroll(renderFn){
  const scrollTop = mainArea.scrollTop;
  renderFn();
  mainArea.scrollTop = scrollTop;
}

/* Blocking modal that requires a click to dismiss - used for confirmations that
   matter enough to not auto-vanish like a toast (e.g. "your upload succeeded"). */
function showBlockingModal(title, message, doneLabel){
  return new Promise((resolve)=>{
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1600; display:flex; align-items:center; justify-content:center; padding:16px;";
    const box = document.createElement("div");
    box.style.cssText = "background:#fff; border-radius:12px; padding:24px; max-width:340px; width:100%; text-align:center;";
    box.innerHTML = `
      <h3 style="margin:0 0 8px 0; font-size:16px; color:var(--charcoal);">${title}</h3>
      <p style="font-size:13px; color:var(--text-muted); margin:0 0 18px 0;">${message}</p>
      <button class="btn-blue" id="blockingModalDone" style="width:100%;">${doneLabel||'Done'}</button>
    `;
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    document.getElementById("blockingModalDone").addEventListener("click", ()=>{
      document.body.removeChild(overlay);
      resolve();
    });
  });
}

let jsPdfLoadPromise = null;
function ensureJsPdfLoaded(){
  if(window.jspdf) return Promise.resolve();
  if(jsPdfLoadPromise) return jsPdfLoadPromise;
  jsPdfLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("Could not load the PDF export library. Check your internet connection."));
    document.head.appendChild(script);
  });
  return jsPdfLoadPromise;
}

function loadImageFromUrl(url){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Could not load image"));
    img.src = url;
  });
}

async function downloadAllReceiptsAsPdf(){
  const btn = document.getElementById("downloadAllReceiptsBtn");
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = "Building PDF...";
  try{
    await ensureJsPdfLoaded();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter" });
    const receipts = allReceiptEntries();
    let first = true;

    for(const r of receipts){
      const url = await getReceiptSignedUrl(r.receiptPath);
      if(!url) continue;
      let img;
      try{ img = await loadImageFromUrl(url); } catch(e){ console.warn("Skipping receipt, could not load image:", e); continue; }

      if(!first) doc.addPage();
      first = false;

      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const margin = 36;
      const caption = `${r.logType} - Truck ${r.truck||'?'} - ${r.date||''} - ${r.description||''} - $${(parseFloat(r.amount)||0).toFixed(2)}`;
      doc.setFontSize(10);
      doc.text(caption, margin, margin, { maxWidth: pageW - margin*2 });

      const availW = pageW - margin*2;
      const availH = pageH - margin*2 - 24;
      const ratio = Math.min(availW / img.width, availH / img.height);
      const drawW = img.width * ratio, drawH = img.height * ratio;
      const x = margin + (availW - drawW) / 2;
      const y = margin + 24;
      doc.addImage(img, "JPEG", x, y, drawW, drawH);
    }

    if(first){
      showAppToast("No receipt images could be loaded.", "warning");
    } else {
      doc.save("FleetHub_Receipts.pdf");
    }
  } catch(e){
    console.error(e);
    showAppToast("Could not build the PDF: " + (e.message||e), "error");
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
}

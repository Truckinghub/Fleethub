<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FleetHub - Fleet Records, All In One Place</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 260 220'%3E%3Cpath d='M40 100 Q130 78 220 100' fill='none' stroke='%231E2A38' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M58 94 L58 45 L140 45 L140 94 Z' fill='%231E2A38'/%3E%3Cpath d='M140 65 L166 65 L184 84 L184 94 L140 94 Z' fill='%231E2A38'/%3E%3Crect x='148' y='70' width='14' height='10' fill='%23F4F5F6'/%3E%3Ccircle cx='82' cy='98' r='14' fill='%231E2A38'/%3E%3Ccircle cx='82' cy='98' r='5' fill='%23F4F5F6'/%3E%3Ccircle cx='164' cy='98' r='14' fill='%231E2A38'/%3E%3Ccircle cx='164' cy='98' r='5' fill='%23F4F5F6'/%3E%3Ccircle cx='99' cy='68' r='20' fill='%23C1703D'/%3E%3Ctext x='99' y='76' font-size='24' font-family='Arial' font-weight='700' fill='%231E2A38' text-anchor='middle'%3E%24%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --charcoal:#1E2A38; --charcoal-light:#2C3B4E; --blue:#5B8DBE; --blue-light:#8FB4D9;
    --blue-pale:#E4EDF5; --copper:#C1703D; --bg:#F4F5F6; --card:#FFFFFF; --border:#E1E4E8;
    --text-muted:#6B7280; --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--charcoal); height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  header{background:var(--charcoal); color:#fff; display:flex; align-items:center; padding:10px 20px; gap:14px; flex-shrink:0; border-bottom:3px solid var(--copper); position:relative; flex-wrap:wrap;}
  header .logo-icon{width:40px;height:34px;flex-shrink:0;}
  header .titles{display:flex; flex-direction:column; line-height:1.2;}
  header .titles .name{font-size:18px; font-weight:bold; letter-spacing:.5px;}
  header .titles .sub{font-size:10px; color:var(--blue-light); letter-spacing:1.2px;}
  header .titles .underline{width:100%; height:2px; background:var(--copper); margin-top:3px;}
  header .toolbar{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  header .status{font-size:11px; color:#C9CDD3; text-align:right; margin-right:4px;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:6px; padding:9px 14px; font-size:13px; font-weight:bold; transition:opacity .15s;}
  button:hover{opacity:.88;} button:disabled{opacity:.35; cursor:not-allowed;}
  .btn-blue{background:var(--blue); color:#fff;} .btn-ghost{background:transparent; color:#fff; border:1px solid #445367;}
  .btn-sm{padding:6px 12px; font-size:12px;} .btn-danger{background:transparent; color:var(--danger); border:1px solid #E8B4AC; padding:6px 10px; font-size:12px;}
  .hamburger-btn{background:transparent; color:#fff; border:1px solid #445367; padding:9px 12px; font-size:16px; line-height:1;}
  .hamburger-wrap{position:relative;}
  .hamburger-menu{position:absolute; top:calc(100% + 8px); right:0; background:var(--charcoal-light); border:1px solid #445367; border-radius:8px; min-width:190px; box-shadow:0 6px 18px rgba(0,0,0,.35); overflow:hidden; z-index:50;}
  .hamburger-menu.hidden{display:none;}
  .hamburger-menu button{display:block; width:100%; text-align:left; background:transparent; color:#D6D9DD; border-radius:0; padding:11px 16px; font-size:13px; font-weight:normal; border-bottom:1px solid #445367;}
  .hamburger-menu button:last-child{border-bottom:none;} .hamburger-menu button:hover{background:#37485D;}
  .hamburger-menu button.active{color:#fff; font-weight:bold; border-left:3px solid var(--blue); padding-left:13px;}
  .app-body{flex:1; display:flex; overflow:hidden; min-height:0;}
  nav{width:190px; background:var(--charcoal-light); overflow-y:auto; flex-shrink:0; display:flex; flex-direction:column; border-left:1px solid #445367;}
  .year-switch{display:flex; align-items:center; justify-content:center; padding:14px; border-bottom:1px solid #445367; flex-shrink:0;}
  .year-switch .yr{font-size:17px; font-weight:bold; color:#fff; letter-spacing:1px;}
  .home-btn{display:block; width:100%; text-align:left; background:transparent; color:#D6D9DD; border-radius:0; padding:12px 16px; font-size:13px; font-weight:bold; border-left:3px solid transparent; border-bottom:1px solid #445367;}
  .home-btn:hover{background:#37485D;} .home-btn.active{background:#37485D; color:#fff; border-left:3px solid var(--blue);}
  .cal-scroll{flex:1; overflow-y:auto; padding-bottom:10px;}
  .month-header{padding:12px 16px 4px 16px; font-size:10px; font-weight:bold; letter-spacing:1.5px; color:#8A97A6; text-transform:uppercase;}
  button.navbtn{display:block; width:100%; text-align:left; background:transparent; color:#D6D9DD; border-radius:0; padding:8px 16px 8px 20px; font-size:13px; font-weight:normal; border-left:3px solid transparent;}
  button.navbtn:hover{background:#37485D;} button.navbtn.active{background:#37485D; color:#fff; border-left:3px solid var(--blue); font-weight:bold;}
  button.navbtn .wk-dates{display:block; font-size:10px; color:#8A97A6; font-weight:normal;}
  main{flex:1; overflow-y:auto; padding:24px 30px; min-width:0;}
  .page-title{font-size:20px; font-weight:bold; margin:0 0 4px 0;}
  .page-sub{font-size:12px; color:var(--text-muted); margin:0 0 20px 0;}
  .section-label{font-size:12px; font-weight:bold; color:var(--text-muted); text-transform:uppercase; letter-spacing:.6px; margin:22px 0 10px 0;}
  .section-label:first-of-type{margin-top:0;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:16px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .card.company{background:var(--charcoal); border-color:var(--charcoal);}
  .card.company h3, .card.company .label{color:#D6D9DD;} .card.company .big{color:#fff;} .card.company h3 .tag{background:var(--blue);}
  .card.clickable{cursor:pointer; transition:box-shadow .15s, transform .15s;}
  .card.clickable:hover{box-shadow:0 4px 14px rgba(0,0,0,.1); transform:translateY(-1px);}
  .card h3{margin:0 0 12px 0; font-size:15px; display:flex; align-items:center; gap:8px;}
  .card h3 .tag{background:var(--charcoal); color:#fff; font-size:11px; padding:3px 9px; border-radius:20px;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:11px; color:var(--text-muted); margin-bottom:3px; font-weight:bold; text-transform:uppercase; letter-spacing:.4px;}
  .field input, .field select{width:100%; padding:9px 9px; border:1px solid var(--border); border-radius:5px; font-size:14px; font-family:inherit;}
  .field input:focus, .field select:focus{outline:none; border-color:var(--blue);}
  .field.readonly input{background:var(--blue-pale); font-weight:bold; color:var(--charcoal); border-color:#C7D9EB;}
  .blockgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .totalsrow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:6px; padding-top:10px; border-top:1px dashed var(--border);}
  .summary-cards .card .big{font-size:22px; font-weight:bold; color:var(--charcoal); margin:2px 0 12px 0;}
  .summary-cards .card .big.negative{color:var(--danger);}
  .summary-cards .card.company .big{color:#fff;}
  .summary-cards .card.company .big.negative{color:#FF9B8A;}
  .summary-cards .card .label{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px;}
  .summary-cards .card .metric{margin-bottom:10px;}
  .hint{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .banner{background:var(--blue-pale); border:1px solid #C7D9EB; color:#2A4E70; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px;}
  .banner b{display:block; margin-bottom:2px;} .banner.soon{background:#EDEFF1; border-color:var(--border); color:var(--text-muted);}
  .subtabs{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap;}
  .subtabs button{background:var(--card); color:var(--charcoal); border:1px solid var(--border); padding:8px 14px; font-size:12px; font-weight:bold;}
  .subtabs button.active{background:var(--charcoal); color:#fff; border-color:var(--charcoal);}
  table.logtable{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  table.logtable th{background:var(--charcoal); color:#fff; text-align:left; padding:10px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.4px;}
  table.logtable td{padding:6px 10px; border-top:1px solid var(--border); vertical-align:middle;}
  table.logtable td input, table.logtable td select{width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:5px; font-size:13px; font-family:inherit;}
  table.logtable td input:focus, table.logtable td select:focus{outline:none; border-color:var(--blue);}
  .addrow-wrap{margin-top:14px;}
  .fleet-section{margin-bottom:28px;}
  .fleet-add-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:flex-end;}
  .fleet-add-row .field{margin-bottom:0; flex:1; min-width:120px;}

  #authScreen{display:none; height:100%; align-items:center; justify-content:center; background:var(--bg); overflow-y:auto; padding:20px;}
  .auth-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:32px 28px; width:100%; max-width:360px; box-shadow:0 4px 24px rgba(0,0,0,.08);}
  .auth-card .logo-icon{width:60px; height:50px; display:block; margin:0 auto 10px auto;}
  .auth-card h1{font-size:20px; text-align:center; margin:0 0 2px 0; color:var(--charcoal);}
  .auth-card .tag-line{font-size:11px; text-align:center; color:var(--text-muted); letter-spacing:1px; margin-bottom:24px; text-transform:uppercase;}
  .auth-card .field{margin-bottom:14px;} .auth-card button.primary{width:100%; padding:11px; font-size:14px; margin-top:6px;}
  .auth-toggle{text-align:center; font-size:13px; color:var(--text-muted); margin-top:16px;}
  .auth-toggle a{color:var(--blue); cursor:pointer; font-weight:bold; text-decoration:none;}
  .auth-error{color:var(--danger); font-size:12px; margin-top:10px; text-align:center;}

  @media (max-width: 760px){
    header{padding:10px 12px;} header .titles .sub{display:none;} header .status{display:none;}
    header .toolbar{gap:6px;} header button{padding:8px 10px; font-size:12px;}
    .app-body{flex-direction:column;}
    nav{width:100%; max-height:none; border-left:none; border-top:1px solid #445367; order:2; flex-direction:column;}
    .year-switch{display:none;}
    .cal-scroll{display:flex; flex-direction:row; overflow-x:auto; overflow-y:hidden; padding:8px; gap:6px; -webkit-overflow-scrolling:touch;}
    .month-header{display:none;}
    button.navbtn{flex-shrink:0; width:auto; white-space:nowrap; border-left:none; border-radius:8px; border:1px solid #445367; padding:8px 12px;}
    button.navbtn.active{border:1px solid var(--blue);} button.navbtn .wk-dates{display:none;}
    .home-btn{order:1; border-bottom:1px solid #445367;}
    main{order:1; padding:16px; flex:1 1 auto;}
    .cards{grid-template-columns:1fr;} .blockgrid{grid-template-columns:1fr 1fr;}
    .totalsrow{grid-template-columns:1fr; gap:8px;}
    table.logtable{display:block; overflow-x:auto; white-space:nowrap;}
  }
</style>
</head>

<script>
const SUPABASE_URL = "https://fszqfhntaofgrompboap.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mIhle8vWmsYr5ELwStQs-g_OQs-84Jr";
const sb = (SUPABASE_URL.startsWith("http")) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ============ WEEK ENGINE ============ */
const ANCHOR_WEEK = 34;
const ANCHOR_SUNDAY_UTC = Date.UTC(2026, 7, 16);
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function weekSunday(week){ return new Date(ANCHOR_SUNDAY_UTC + (week-ANCHOR_WEEK)*7*86400000); }
function fmtShort(date){ return `${MONTH_NAMES[date.getUTCMonth()]} ${String(date.getUTCDate()).padStart(2,"0")}`; }
function weekDateRangeLabel(week){
  const sun = weekSunday(week); const sat = new Date(sun); sat.setUTCDate(sun.getUTCDate()+6);
  if(sun.getUTCFullYear() !== sat.getUTCFullYear()) return `${fmtShort(sun)}, ${sun.getUTCFullYear()} - ${fmtShort(sat)}, ${sat.getUTCFullYear()}`;
  return `${fmtShort(sun)} - ${fmtShort(sat)}, ${sat.getUTCFullYear()}`;
}
function buildWeekList(){
  const list=[]; let week=ANCHOR_WEEK; const yearEnd=Date.UTC(2026,11,31);
  while(true){ const sun=weekSunday(week); const sat=new Date(sun); sat.setUTCDate(sun.getUTCDate()+6); list.push(week); if(sat.getTime()>=yearEnd) break; week++; }
  return list;
}
const WEEKS = buildWeekList();
function groupWeeksByMonth(){
  const groups=[]; let current=null;
  WEEKS.forEach(w=>{
    const sun=weekSunday(w); const key=`${sun.getUTCFullYear()}-${sun.getUTCMonth()}`;
    if(!current || current.key!==key){ current={key, label:`${MONTH_NAMES[sun.getUTCMonth()]} ${sun.getUTCFullYear()}`, weeks:[]}; groups.push(current); }
    current.weeks.push(w);
  });
  return groups;
}

/* ============ APP STATE ============ */
let vehicles = [];   // {truckId, addedWeek}
let drivers = [];    // {name}
let contractsEntries = []; // {week, truck, contractId, blockRate, numBlocks, block1, block2, block3}
let fuelEntries = [];       // {week, truck, amount}
let payrollEntries = [];    // {week, driver, truck, amount}
let partsLog = [], mechanicLog = [], maintenanceLog = [];

let currentModule = "contracts";
let currentExpenseTab = "overview";
let currentView = { type:"summary" };
let unsaved = false;
let currentUserId = null;

function activeVehiclesForWeek(week){ return vehicles.filter(v=>v.addedWeek<=week); }
function vehicleExists(truckId){ return vehicles.some(v=>v.truckId===truckId); }

function getContractEntry(week, truck){
  let e = contractsEntries.find(x=>x.week===week && x.truck===truck);
  if(!e){ e = { week, truck, contractId:"", blockRate:"", numBlocks:"", block1:"", block2:"", block3:"" }; contractsEntries.push(e); }
  return e;
}
function getFuelEntry(week, truck){
  let e = fuelEntries.find(x=>x.week===week && x.truck===truck);
  if(!e){ e = { week, truck, amount:"" }; fuelEntries.push(e); }
  return e;
}

/* ============ COMPUTE HELPERS ============ */
function computeRow(truck, d){
  const rate=parseFloat(d.blockRate)||0, n=parseInt(d.numBlocks)||0;
  const contractRate=rate*n;
  const b1=parseFloat(d.block1)||0, b2=parseFloat(d.block2)||0, b3=parseFloat(d.block3)||0;
  const contractAcc=b1+b2+b3; const totalAcc=contractAcc-contractRate;
  return { truck, contractId:d.contractId||"", blockRate:d.blockRate||"", numBlocks:d.numBlocks||"",
    block1:d.block1||"", block2:d.block2||"", block3:d.block3||"", contractRate, contractAcc, totalAcc };
}

function computeAllTimeTotals(){
  const totals = vehicles.map(v=>{
    const truck=v.truckId;
    let grossContracts=0, grossContractsAcc=0, grossAcc=0;
    contractsEntries.filter(e=>e.truck===truck).forEach(e=>{
      const row=computeRow(truck,e);
      grossContracts+=row.contractRate; grossContractsAcc+=row.contractAcc; grossAcc+=row.totalAcc;
    });
    return { truck, grossContracts, grossContractsAcc, grossAcc };
  });
  const company = totals.reduce((acc,t)=>({
    grossContracts:acc.grossContracts+t.grossContracts, grossContractsAcc:acc.grossContractsAcc+t.grossContractsAcc, grossAcc:acc.grossAcc+t.grossAcc
  }), {grossContracts:0, grossContractsAcc:0, grossAcc:0});
  return { totals, company };
}

function computeFuelTotals(){
  const totals = vehicles.map(v=>{
    const truck=v.truckId;
    const total = fuelEntries.filter(e=>e.truck===truck).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
    return { truck, total };
  });
  const company = totals.reduce((a,t)=>a+t.total,0);
  return { totals, company };
}

function computePayrollTotalsByTruck(){
  const totals = vehicles.map(v=>{
    const truck=v.truckId;
    const total = payrollEntries.filter(e=>e.truck===truck).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
    return { truck, total };
  });
  const company = totals.reduce((a,t)=>a+t.total,0);
  return { totals, company };
}

function computePayrollTotalsByDriver(){
  const totals = drivers.map(d=>{
    const total = payrollEntries.filter(e=>e.driver===d.name).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
    return { driver:d.name, total };
  });
  const company = totals.reduce((a,t)=>a+t.total,0);
  return { totals, company };
}

function computeLogSummary(entries, summaryType){
  if(summaryType==="sum"){
    const sums={}; vehicles.forEach(v=>sums[v.truckId]=0);
    entries.forEach(e=>{ if(sums.hasOwnProperty(e.truck)) sums[e.truck]+=parseFloat(e.amount)||0; });
    const grand = Object.values(sums).reduce((a,b)=>a+b,0);
    return { sums, grand };
  } else {
    const maxes={}; vehicles.forEach(v=>maxes[v.truckId]=0);
    entries.forEach(e=>{ if(maxes.hasOwnProperty(e.truck)) maxes[e.truck]=Math.max(maxes[e.truck], parseFloat(e.amount)||0); });
    return { maxes };
  }
}

function computeDashboardYTD(){
  const contracts = computeAllTimeTotals();
  const fuel = computeFuelTotals();
  const parts = computeLogSummary(partsLog, "sum");
  const mechanic = computeLogSummary(mechanicLog, "sum");
  const payroll = computePayrollTotalsByTruck();

  const perTruck = vehicles.map((v,i)=>{
    const truck = v.truckId;
    const ytdContracts = contracts.totals[i].grossContracts;
    const ytdAccessories = contracts.totals[i].grossAcc;
    const ytdExpenses = (fuel.totals[i].total||0) + (parts.sums[truck]||0) + (mechanic.sums[truck]||0);
    const ytdPayroll = payroll.totals[i].total;
    const grossYTD = ytdContracts + ytdAccessories;
    const netYTD = grossYTD - ytdExpenses - ytdPayroll;
    return { truck, ytdContracts, ytdAccessories, ytdExpenses, ytdPayroll, grossYTD, netYTD };
  });

  const company = perTruck.reduce((acc,t)=>({
    ytdContracts:acc.ytdContracts+t.ytdContracts, ytdAccessories:acc.ytdAccessories+t.ytdAccessories,
    ytdExpenses:acc.ytdExpenses+t.ytdExpenses, ytdPayroll:acc.ytdPayroll+t.ytdPayroll,
    grossYTD:acc.grossYTD+t.grossYTD, netYTD:acc.netYTD+t.netYTD
  }), {ytdContracts:0, ytdAccessories:0, ytdExpenses:0, ytdPayroll:0, grossYTD:0, netYTD:0});

  return { perTruck, company };
}

/* ============ CRC32 / ZIP ENGINE ============ */
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function strToBytes(str){return new TextEncoder().encode(str);}
function concatBytes(arrays){let total=0;for(const a of arrays)total+=a.length;const out=new Uint8Array(total);let off=0;for(const a of arrays){out.set(a,off);off+=a.length;}return out;}
function u16(v){const b=new Uint8Array(2);new DataView(b.buffer).setUint16(0,v,true);return b;}
function u32(v){const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,v>>>0,true);return b;}
function buildZip(files){
  const localParts=[],centralParts=[];let offset=0;
  for(const f of files){
    const nameBytes=strToBytes(f.name),dataBytes=f.data,crc=crc32(dataBytes),size=dataBytes.length;
    const localHeader=concatBytes([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(size),u32(size),u16(nameBytes.length),u16(0),nameBytes]);
    localParts.push(localHeader,dataBytes);
    const centralHeader=concatBytes([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(size),u32(size),u16(nameBytes.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),nameBytes]);
    centralParts.push(centralHeader);
    offset+=localHeader.length+dataBytes.length;
  }
  const centralDir=concatBytes(centralParts),centralOffset=offset,centralSize=centralDir.length;
  const eocd=concatBytes([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(centralSize),u32(centralOffset),u16(0)]);
  return concatBytes([...localParts,centralDir,eocd]);
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inlineStrCell(ref,value,styleId){const s=styleId!==undefined?` s="${styleId}"`:"";return `<c r="${ref}"${s} t="inlineStr"><is><t>${esc(value)}</t></is></c>`;}
function numCell(ref,value,styleId){const s=styleId!==undefined?` s="${styleId}"`:"";const v=(value===""||value===null||value===undefined||isNaN(value))?"":value;if(v==="")return `<c r="${ref}"${s}/>`;return `<c r="${ref}"${s}><v>${v}</v></c>`;}
function formulaCell(ref,formula,cachedValue,styleId){const s=styleId!==undefined?` s="${styleId}"`:"";return `<c r="${ref}"${s}><f>${esc(formula)}</f><v>${cachedValue}</v></c>`;}
function buildWorkbookXML(sheetNames){let xml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>`;sheetNames.forEach((name,i)=>{xml+=`<sheet name="${esc(name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`;});xml+=`</sheets></workbook>`;return xml;}
function buildWorkbookRelsXML(sheetCount){let xml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`;for(let i=0;i<sheetCount;i++)xml+=`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`;xml+=`<Relationship Id="rId${sheetCount+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`;xml+=`</Relationships>`;return xml;}
function buildContentTypesXML(sheetCount){let xml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`;for(let i=0;i<sheetCount;i++)xml+=`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`;xml+=`<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;return xml;}
function buildRootRelsXML(){return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;}
function buildStylesXML(){return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="&quot;$&quot;#,##0.00"/><numFmt numFmtId="165" formatCode="#,##0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;}

/* ---- Contracts week sheet: rows = vehicles active that week ---- */
function buildWeekSheetXML(week, dateRange, rows){
  let xml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>`;
  xml += `<row r="1">${inlineStrCell("A1",`Week ${week}  (${dateRange})`,3)}</row>`;
  xml += `<row r="2">${inlineStrCell("A2","Acc = Accessories (fuel surcharge/tolls). Contract Rate = Block Rate x Number of Blocks. Week runs Sunday-Saturday.",0)}</row>`;
  const headers=["Truck ID","Contract ID","Block Rate","Number of Blocks","Block 1 + Acc","Block 2 + Acc","Block 3 + Acc","Contract Rate","Contract + Acc","Total Acc"];
  const cols=["A","B","C","D","E","F","G","H","I","J"];
  xml += `<row r="4">` + headers.map((h,i)=>inlineStrCell(cols[i]+"4",h,2)).join("") + `</row>`;
  rows.forEach((r,idx)=>{
    const rr=5+idx;
    xml += `<row r="${rr}">`;
    xml += inlineStrCell(`A${rr}`,r.truck,0);
    xml += inlineStrCell(`B${rr}`,r.contractId,0);
    xml += numCell(`C${rr}`,r.blockRate,1);
    xml += numCell(`D${rr}`,r.numBlocks,0);
    xml += numCell(`E${rr}`,r.block1,1);
    xml += numCell(`F${rr}`,r.block2,1);
    xml += numCell(`G${rr}`,r.block3,1);
    xml += formulaCell(`H${rr}`,`C${rr}*D${rr}`,r.contractRate,1);
    xml += formulaCell(`I${rr}`,`SUM(E${rr}:G${rr})`,r.contractAcc,1);
    xml += formulaCell(`J${rr}`,`I${rr}-H${rr}`,r.totalAcc,1);
    xml += `</row>`;
  });
  xml += `</sheetData></worksheet>`;
  return xml;
}

/* ---- Summary sheet: one row per vehicle in the roster, YTD via SUMIF across every week sheet
   (safer than fixed-row-position SUMs, since a vehicle may not appear in every week sheet) ---- */
function buildSummarySheetXML(perVehicleRows, companyRow){
  let xml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>`;
  xml += `<row r="1">${inlineStrCell("A1","FleetHub - Contracts Summary",3)}</row>`;
  xml += `<row r="2">${inlineStrCell("A2","All-time totals per vehicle across every week tab.",0)}</row>`;
  const headers=["Truck ID","Gross Contracts","Gross Accessories"];
  xml += `<row r="4">` + headers.map((h,i)=>inlineStrCell(["A","B","C"][i]+"4",h,2)).join("") + `</row>`;
  perVehicleRows.forEach((r,idx)=>{
    const rr=5+idx;
    const refsH = WEEKS.map(w=>`SUMIF('Week ${w}'!A5:A500,"${r.truck}",'Week ${w}'!H5:H500)`).join("+");
    const refsI = WEEKS.map(w=>`SUMIF('Week ${w}'!A5:A500,"${r.truck}",'Week ${w}'!I5:I500)`).join("+");
    xml += `<row r="${rr}">`;
    xml += inlineStrCell(`A${rr}`,r.truck,0);
    xml += formulaCell(`B${rr}`,refsH,r.grossContracts,1);
    xml += formulaCell(`C${rr}`,refsI,r.grossContractsAcc,1);
    xml += `</row>`;
  });
  const compRow = 5 + perVehicleRows.length;
  const firstRow=5, lastRow=compRow-1;
  xml += `<row r="${compRow}">`;
  xml += inlineStrCell(`A${compRow}`,"Company Total",2);
  xml += formulaCell(`B${compRow}`,`SUM(B${firstRow}:B${lastRow})`,companyRow.grossContracts,1);
  xml += formulaCell(`C${compRow}`,`SUM(C${firstRow}:C${lastRow})`,companyRow.grossContractsAcc,1);
  xml += `</row>`;
  xml += `</sheetData></worksheet>`;
  return xml;
}

  let xml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>`;
  xml += `<row r="1">${inlineStrCell("A1","FleetHub - Fuel Expense Log",3)}</row>`;
  xml += `<row r="2">${inlineStrCell("A2","Fuel cost logged per truck per week.",0)}</row>`;
  xml += `<row r="4">${inlineStrCell("A4","Truck ID",2)}${inlineStrCell("B4","FUEL YTD",2)}</row>`;
  const nRows = Math.max(50, fuelEntries.length);
  const firstDataRow = 6 + vehicles.length + 1;
  const lastDataRow = firstDataRow + nRows - 1;
  vehicles.forEach((v,idx)=>{
    const rr = 5+idx;
    const total = fuelEntries.filter(e=>e.truck===v.truckId).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
    const f = `SUMIF(C${firstDataRow}:C${lastDataRow},"${v.truckId}",D${firstDataRow}:D${lastDataRow})`;
    xml += `<row r="${rr}">${inlineStrCell(`A${rr}`,v.truckId,0)}${formulaCell(`B${rr}`,f,total,1)}</row>`;
  });
  const compRow = 5+vehicles.length;
  const total = computeFuelTotals().company;
  xml += `<row r="${compRow}">${inlineStrCell(`A${compRow}`,"Company Total",2)}${formulaCell(`B${compRow}`,`SUM(B5:B${compRow-1})`,total,1)}</row>`;

  const logHeaderRow = firstDataRow-1;
  xml += `<row r="${logHeaderRow}">${["Week","Date Range","Truck","Amount"].map((h,i)=>inlineStrCell(["A","B","C","D"][i]+logHeaderRow,h,2)).join("")}</row>`;
  for(let i=0;i<nRows;i++){
    const rr = firstDataRow+i;
    const e = fuelEntries[i] || {week:"",truck:"",amount:""};
    const dateRange = e.week ? weekDateRangeLabel(e.week) : "";

    xml += inlineStrCell(`B${rr}`, dateRange, 0);
    xml += inlineStrCell(`C${rr}`, e.truck, 0);
    xml += numCell(`D${rr}`, e.amount, 1);
    xml += `</row>`;
  }

/* ---- Parts / Mechanic (sum) and Maintenance (max): per-vehicle summary rows + flat log ---- */
function buildLogSheetXML(title, subtitle, colHeaders, fieldOrder, entries, summaryType){
  let xml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>`;
  xml += `<row r="1">${inlineStrCell("A1",title,3)}</row>`;
  xml += `<row r="2">${inlineStrCell("A2",subtitle,0)}</row>`;
  const nRows = Math.max(150, entries.length);
  const firstDataRow = 6 + vehicles.length + 1;
  const lastDataRow = firstDataRow + nRows - 1;

  if(summaryType==="sum"){
    xml += `<row r="4">${inlineStrCell("A4","Truck ID",2)}${inlineStrCell("B4","Total Paid",2)}</row>`;
    vehicles.forEach((v,idx)=>{
      const rr=5+idx;
      const total = entries.filter(e=>e.truck===v.truckId).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
      const f = `SUMIF(A${firstDataRow}:A${lastDataRow},"${v.truckId}",D${firstDataRow}:D${lastDataRow})`;
      xml += `<row r="${rr}">${inlineStrCell(`A${rr}`,v.truckId,0)}${formulaCell(`B${rr}`,f,total,1)}</row>`;
    });
    const compRow=5+vehicles.length;
    const grand = computeLogSummary(entries,"sum").grand;
    xml += `<row r="${compRow}">${inlineStrCell(`A${compRow}`,"Grand Total",2)}${formulaCell(`B${compRow}`,`SUM(B5:B${compRow-1})`,grand,1)}</row>`;
  } else {
    xml += `<row r="4">${inlineStrCell("A4","Truck ID",2)}${inlineStrCell("B4","Latest Mileage",2)}</row>`;
    vehicles.forEach((v,idx)=>{
      const rr=5+idx;
      const entriesForTruck = entries.filter(e=>e.truck===v.truckId);
      const max = entriesForTruck.reduce((a,e)=>Math.max(a,parseFloat(e.amount)||0),0);
      const f = `SUMPRODUCT(MAX((A${firstDataRow}:A${lastDataRow}="${v.truckId}")*D${firstDataRow}:D${lastDataRow}))`;
      xml += `<row r="${rr}">${inlineStrCell(`A${rr}`,v.truckId,0)}${formulaCell(`B${rr}`,f,max,4)}</row>`;
    });
  }

  const logHeaderRow = firstDataRow-1;
  const logHeaders = ["Truck", colHeaders[0], colHeaders[1], colHeaders[2]];
  xml += `<row r="${logHeaderRow}">` + logHeaders.map((h,i)=>inlineStrCell(["A","B","C","D"][i]+logHeaderRow,h,2)).join("") + `</row>`;
  for(let i=0;i<nRows;i++){
    const rr = firstDataRow+i;
    const e = entries[i] || { truck:"", [fieldOrder[0]]:"", [fieldOrder[1]]:"", [fieldOrder[2]]:"" };
    xml += `<row r="${rr}">`;
    xml += inlineStrCell(`A${rr}`, e.truck||"", 0);
    const v0=e[fieldOrder[0]]||"", v1=e[fieldOrder[1]]||"", v2=e[fieldOrder[2]]||"";
    xml += inlineStrCell(`B${rr}`, v0, 0);
    xml += inlineStrCell(`C${rr}`, v1, 0);
    if(fieldOrder[2]==="amount") xml += numCell(`D${rr}`, v2, summaryType==="max"?4:1);
    else xml += inlineStrCell(`D${rr}`, v2, 0);
    xml += `</row>`;
  }
  xml += `</sheetData></worksheet>`;
  return xml;
}

function buildWorkbookBytes(){
  const sheetNames = ["Summary","Vehicles","Drivers","Fuel","Parts","Mechanic","Maintenance","Payroll", ...WEEKS.map(w=>`Week ${w}`)];
  const sheetXMLs = [];
  const { totals, company } = computeAllTimeTotals();
  sheetXMLs.push(buildSummarySheetXML(totals, company));
  sheetXMLs.push(buildVehiclesSheetXML());
  sheetXMLs.push(buildDriversSheetXML());
  sheetXMLs.push(buildFuelSheetXML());
  sheetXMLs.push(buildLogSheetXML("FleetHub - Parts Expense Log","Parts purchased per truck.",["Date","Description","Price"],["date","description","amount"],partsLog,"sum"));
  sheetXMLs.push(buildLogSheetXML("FleetHub - Mechanic / Repair Log","Repairs paid per truck.",["Date","Description of Repair","Amount Paid"],["date","description","amount"],mechanicLog,"sum"));
  sheetXMLs.push(buildLogSheetXML("FleetHub - Maintenance Records","Service history per truck.",["Description","Date","Mileage"],["description","date","amount"],maintenanceLog,"max"));
  sheetXMLs.push(buildPayrollSheetXML());
  WEEKS.forEach(w=>{
    const rows = activeVehiclesForWeek(w).map(v=>computeRow(v.truckId, getContractEntry(w, v.truckId)));
    sheetXMLs.push(buildWeekSheetXML(w, weekDateRangeLabel(w), rows));
  });

  const files=[];
  files.push({name:"[Content_Types].xml", data:strToBytes(buildContentTypesXML(sheetNames.length))});
  files.push({name:"_rels/.rels", data:strToBytes(buildRootRelsXML())});
  files.push({name:"xl/workbook.xml", data:strToBytes(buildWorkbookXML(sheetNames))});
  files.push({name:"xl/_rels/workbook.xml.rels", data:strToBytes(buildWorkbookRelsXML(sheetNames.length))});
  files.push({name:"xl/styles.xml", data:strToBytes(buildStylesXML())});
  sheetXMLs.forEach((xml,i)=>{ files.push({name:`xl/worksheets/sheet${i+1}.xml`, data:strToBytes(xml)}); });
  return buildZip(files);
}

function exportExcel(){
  const bytes = buildWorkbookBytes();
  const blob = new Blob([bytes], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="FleetHub_Export.xlsx";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    }));
    const fuelRows = fuelEntries.map(e=>({ user_id:currentUserId, week:e.week, truck:e.truck, amount:e.amount!==""?parseFloat(e.amount):null }));
    const payrollRows = payrollEntries.filter(e=>e.driver).map(e=>({ user_id:currentUserId, week:e.week, driver:e.driver, truck:e.truck||null, amount:e.amount!==""?parseFloat(e.amount):null }));
    const partsRows = partsLog.filter(e=>e.truck||e.date||e.description||e.amount).map(e=>({ user_id:currentUserId, truck:e.truck||null, entry_date:e.date||null, description:e.description||null, amount:e.amount!==""?parseFloat(e.amount):null }));
    const mechRows = mechanicLog.filter(e=>e.truck||e.date||e.description||e.amount).map(e=>({ user_id:currentUserId, truck:e.truck||null, entry_date:e.date||null, description:e.description||null, amount:e.amount!==""?parseFloat(e.amount):null }));
    const maintRows = maintenanceLog.filter(e=>e.truck||e.date||e.description||e.amount).map(e=>({ user_id:currentUserId, truck:e.truck||null, description:e.description||null, entry_date:e.date||null, mileage:e.amount!==""?parseFloat(e.amount):null }));

    const tasks = [
      ["vehicles", vehicleRows], ["drivers", driverRows], ["contracts", contractRows],
      ["fuel", fuelRows], ["payroll", payrollRows], ["parts", partsRows], ["mechanic", mechRows], ["maintenance", maintRows]
    ];
    for(const [table, rows] of tasks){
      const { error: delErr } = await sb.from(table).delete().eq("user_id", currentUserId);
      if(delErr) throw delErr;
      if(rows.length){ const { error: insErr } = await sb.from(table).insert(rows); if(insErr) throw insErr; }
    }
    markSaved();
  } catch(e){
    console.error(e);
    alert("Save failed: " + (e.message||e));
    setStatus("Save failed");
  }
}

async function loadAll(){
  if(!sb) return;
  setStatus("Loading...");
  try{
    const [veh, drv, c, f, p, parts, mech, maint] = await Promise.all([
      sb.from("vehicles").select("*"), sb.from("drivers").select("*"),
      sb.from("contracts").select("*"), sb.from("fuel").select("*"), sb.from("payroll").select("*"),
      sb.from("parts").select("*"), sb.from("mechanic").select("*"), sb.from("maintenance").select("*"),
    ]);
    [veh,drv,c,f,p,parts,mech,maint].forEach(r=>{ if(r.error) throw r.error; });

    vehicles = (veh.data||[]).map(r=>({ truckId:r.truck_id, addedWeek:r.added_week }));
    drivers = (drv.data||[]).map(r=>({ name:r.name }));
    contractsEntries = (c.data||[]).map(r=>({ week:r.week, truck:r.truck, contractId:r.contract_id??"", blockRate:r.block_rate??"", numBlocks:r.num_blocks??"", block1:r.block1??"", block2:r.block2??"", block3:r.block3??"" }));
    fuelEntries = (f.data||[]).map(r=>({ week:r.week, truck:r.truck, amount:r.amount??"" }));
    payrollEntries = (p.data||[]).map(r=>({ week:r.week, driver:r.driver, truck:r.truck||"", amount:r.amount??"" }));
    partsLog = (parts.data||[]).map(r=>({ truck:r.truck||"", date:r.entry_date||"", description:r.description||"", amount:r.amount??"" }));
    mechanicLog = (mech.data||[]).map(r=>({ truck:r.truck||"", date:r.entry_date||"", description:r.description||"", amount:r.amount??"" }));
    maintenanceLog = (maint.data||[]).map(r=>({ truck:r.truck||"", description:r.description||"", date:r.entry_date||"", amount:r.mileage??"" }));

    // Migration safety net: if no vehicle roster exists yet but data references trucks
    // (e.g. upgrading from the older fixed-3-truck version), auto-create roster entries
    // so existing history stays visible instead of disappearing.
    if(vehicles.length===0){
      const seen = {};
      const noteTruck = (truck, week)=>{
        if(!truck) return;
        if(!seen[truck] || week<seen[truck]) seen[truck] = week ?? 34;
      };
      contractsEntries.forEach(e=>noteTruck(e.truck, e.week));
      fuelEntries.forEach(e=>noteTruck(e.truck, e.week));
      payrollEntries.forEach(e=>noteTruck(e.truck, e.week));
      [...partsLog, ...mechanicLog, ...maintenanceLog].forEach(e=>noteTruck(e.truck, 34));
      vehicles = Object.keys(seen).map(truckId=>({ truckId, addedWeek: seen[truckId] }));
      if(vehicles.length) markUnsaved(); // so the recovered roster gets persisted on next Save
    }

    setStatus(""); if(vehicles.length===0) markUnsaved(); else markSaved();
  } catch(e){
    console.error(e);
    setStatus("Load failed");
  }
}

}
function moneyStr(v){ return v<0 ? `-$${Math.abs(v).toFixed(2)}` : `$${v.toFixed(2)}`; }

function payrollRowHTML(e, idx, active){
  const driverOptions = drivers.map(d=>`<option value="${d.name}" ${e.driver===d.name?'selected':''}>${d.name}</option>`).join("");
  const truckOptions = active.map(v=>`<option value="${v.truckId}" ${e.truck===v.truckId?'selected':''}>${v.truckId}</option>`).join("");
  return `<tr data-idx="${idx}">
    <td><select class="pr-driver"><option value="">-</option>${driverOptions}</select></td>
    <td><select class="pr-truck"><option value="">-</option>${truckOptions}</select></td>
    <td><input class="pr-amount" type="number" step="0.01" min="0" value="${e.amount||''}"></td>
    <td><button class="btn-danger pr-delete">Remove</button></td>
  </tr>`;

function wirePayrollTable(week, active){
  const entries = payrollEntries.filter(e=>e.week===week);
  const tbody = document.getElementById("payrollTbody");
  tbody.querySelectorAll("tr").forEach(tr=>{
    const idx = parseInt(tr.dataset.idx);
    tr.querySelector(".pr-driver").addEventListener("change", e=>{ entries[idx].driver=e.target.value; markUnsaved(); });
    tr.querySelector(".pr-truck").addEventListener("change", e=>{ entries[idx].truck=e.target.value; markUnsaved(); });
    tr.querySelector(".pr-amount").addEventListener("input", e=>{ entries[idx].amount=e.target.value; markUnsaved(); });
    tr.querySelector(".pr-delete").addEventListener("click", ()=>{
      const globalIdx = payrollEntries.indexOf(entries[idx]);
      if(globalIdx>=0) payrollEntries.splice(globalIdx,1);
      markUnsaved(); renderMain();
    });
  });
  document.getElementById("addPayrollRow").addEventListener("click", ()=>{
    payrollEntries.push({ week, driver:"", truck:"", amount:"" });
    markUnsaved(); renderMain();
  });
}

/* ============ LOG PAGES (Parts / Mechanic / Maintenance) ============ */
function getLogArray(key){ if(key==="parts") return partsLog; if(key==="mechanic") return mechanicLog; return maintenanceLog; }
function renderLogPage(cfg){
  const entries = getLogArray(cfg.key);
  const summary = computeLogSummary(entries, cfg.summaryType);
  let html = `<h1 class="page-title">${cfg.title}</h1><p class="page-sub">${cfg.subtitle}</p>`;
  if(cfg.key==="parts"||cfg.key==="mechanic") html += subtabsHTML();
  if(!vehicles.length) html += `<div class="banner"><b>No vehicles yet</b>Go to Manage Fleet (hamburger menu) to add one first.</div>`;
  html += `<div class="cards summary-cards">`;
  vehicles.forEach(v=>{
    const truck=v.truckId;
    const val = cfg.summaryType==="sum" ? summary.sums[truck] : summary.maxes[truck];
    const display = cfg.currency ? moneyStr(val) : val.toLocaleString();
    html += `<div class="card"><h3>Truck <span class="tag">${truck}</span></h3><div class="metric"><div class="label">${cfg.summaryLabel}</div><div class="big">${display}</div></div></div>`;
  });
  if(cfg.summaryType==="sum") html += `<div class="card company"><h3>${cfg.companyLabel}</h3><div class="metric"><div class="big">${moneyStr(summary.grand)}</div></div></div>`;
  html += `</div>`;
  html += `<div class="section-label">Entry Log</div>`;
  html += `<table class="logtable"><thead><tr><th>Truck</th><th>${cfg.colHeaders[0]}</th><th>${cfg.colHeaders[1]}</th><th>${cfg.colHeaders[2]}</th><th></th></tr></thead><tbody id="logTbody">`;
  entries.forEach((e,idx)=>{ html += logRowHTML(cfg, e, idx); });
  html += `</tbody></table><div class="addrow-wrap"><button class="btn-blue btn-sm" id="addLogRow">+ Add Entry</button></div>`;
  mainArea.innerHTML = html;
  if(cfg.key==="parts"||cfg.key==="mechanic") wireSubtabs();
  wireLogTable(cfg);
}
function logRowHTML(cfg, e, idx){
  const truckOptions = vehicles.map(v=>`<option value="${v.truckId}" ${e.truck===v.truckId?'selected':''}>${v.truckId}</option>`).join("");
  const f0=cfg.fieldOrder[0], f1=cfg.fieldOrder[1], f2=cfg.fieldOrder[2];
  const type0=f0==="date"?"date":"text", type1=f1==="date"?"date":"text", type2=f2==="amount"?"number":(f2==="date"?"date":"text");
  return `<tr data-idx="${idx}">
    <td><select class="log-truck"><option value="">-</option>${truckOptions}</select></td>
    <td><input class="log-f0" type="${type0}" value="${e[f0]||''}"></td>
    <td><input class="log-f1" type="${type1}" value="${e[f1]||''}"></td>
    <td><input class="log-f2" type="${type2}" ${type2==='number'?'step="0.01" min="0"':''} value="${e[f2]||''}"></td>
    <td><button class="btn-danger log-delete">Remove</button></td>
  </tr>`;
}
function wireLogTable(cfg){
  const entries = getLogArray(cfg.key);
  const tbody = document.getElementById("logTbody");
  tbody.querySelectorAll("tr").forEach(tr=>{
    const idx=parseInt(tr.dataset.idx);
    tr.querySelector(".log-truck").addEventListener("change", e=>{ entries[idx].truck=e.target.value; markUnsaved(); refreshLogSummary(cfg); });
    tr.querySelector(".log-f0").addEventListener("input", e=>{ entries[idx][cfg.fieldOrder[0]]=e.target.value; markUnsaved(); });
    tr.querySelector(".log-f1").addEventListener("input", e=>{ entries[idx][cfg.fieldOrder[1]]=e.target.value; markUnsaved(); });
    tr.querySelector(".log-f2").addEventListener("input", e=>{ entries[idx][cfg.fieldOrder[2]]=e.target.value; markUnsaved(); refreshLogSummary(cfg); });
    tr.querySelector(".log-delete").addEventListener("click", ()=>{ entries.splice(idx,1); markUnsaved(); renderMain(); });
  });
  document.getElementById("addLogRow").addEventListener("click", ()=>{
    const blank={truck:""}; blank[cfg.fieldOrder[0]]=""; blank[cfg.fieldOrder[1]]=""; blank[cfg.fieldOrder[2]]="";
    entries.push(blank); markUnsaved(); renderMain();
  });
}
function refreshLogSummary(cfg){
  const entries = getLogArray(cfg.key); const summary = computeLogSummary(entries, cfg.summaryType);
  const cards = mainArea.querySelectorAll(".summary-cards .card");
  vehicles.forEach((v,i)=>{
    const val = cfg.summaryType==="sum" ? summary.sums[v.truckId] : summary.maxes[v.truckId];
    const display = cfg.currency ? moneyStr(val) : val.toLocaleString();
    const bigEl = cards[i] && cards[i].querySelector(".big"); if(bigEl) bigEl.textContent = display;
  });
  if(cfg.summaryType==="sum" && cards[vehicles.length]){
    const bigEl = cards[vehicles.length].querySelector(".big"); if(bigEl) bigEl.textContent = moneyStr(summary.grand);
  }
}

function markUnsaved(){ unsaved=true; setStatus("Unsaved changes"); }
function markSaved(){ unsaved=false; setStatus(""); }
function setStatus(msg){ statusText.textContent = msg; }

btnSave.addEventListener("click", saveAll);
btnExport.addEventListener("click", exportExcel);
homeBtn.addEventListener("click", ()=>{ currentView={type:"summary"}; renderNav(); renderMain(); });
hamburgerBtn.addEventListener("click", e=>{ e.stopPropagation(); hamburgerMenu.classList.toggle("hidden"); });
document.addEventListener("click", ()=>{ hamburgerMenu.classList.add("hidden"); });
hamburgerMenu.querySelectorAll("button").forEach(b=>{
  b.addEventListener("click", async e=>{
    e.stopPropagation();
    if(b.dataset.action==="signout"){ await sb.auth.signOut(); return; }
    currentModule = b.dataset.module;
    if(currentModule==="expenses") currentExpenseTab="overview";
    currentView={type:"summary"};
    hamburgerMenu.querySelectorAll("button[data-module]").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); hamburgerMenu.classList.add("hidden");
    renderNav(); renderMain();
  });
});

/* ============ AUTH ============ */
let authMode="signin";
const authEmail=document.getElementById("authEmail"), authPassword=document.getElementById("authPassword");
const authSubmitBtn=document.getElementById("authSubmitBtn"), authError=document.getElementById("authError");
const authToggle=document.getElementById("authToggle"), authToggleLink=document.getElementById("authToggleLink");
authToggleLink.addEventListener("click", ()=>{
  authMode = authMode==="signin" ? "signup" : "signin";
  authSubmitBtn.textContent = authMode==="signin" ? "Sign In" : "Create Account";
  authToggle.innerHTML = authMode==="signin" ? `Don't have an account? <a id="authToggleLink">Sign up</a>` : `Already have an account? <a id="authToggleLink">Sign in</a>`;
  document.getElementById("authToggleLink").addEventListener("click", ()=>authToggleLink.click());
  authError.textContent="";
});
authSubmitBtn.addEventListener("click", async ()=>{
  if(!sb){ authError.textContent="Supabase isn't configured yet - see SETUP_INSTRUCTIONS.md"; return; }
  authError.textContent="";
  const email=authEmail.value.trim(), password=authPassword.value;
  if(!email||!password){ authError.textContent="Enter both email and password."; return; }
  authSubmitBtn.disabled=true;
  try{
    if(authMode==="signin"){ const {error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error; }
    else { const {error}=await sb.auth.signUp({email,password}); if(error) throw error; authError.style.color="#2A7A4E"; authError.textContent="Account created. Check your email to confirm, then sign in."; }
  } catch(e){ authError.style.color=""; authError.textContent = e.message||"Something went wrong."; }
  finally { authSubmitBtn.disabled=false; }
});

/* ============ INIT ============ */
async function showApp(userId){
  currentUserId=userId; authScreen.style.display="none"; appRoot.style.display="flex";
  hamburgerMenu.querySelector('button[data-module="contracts"]').classList.add("active");
  await loadAll(); renderNav(); renderMain();
}
function showAuth(){ appRoot.style.display="none"; authScreen.style.display="flex"; }
if(sb){ sb.auth.onAuthStateChange((event,session)=>{ if(session&&session.user) showApp(session.user.id); else showAuth(); }); }
else { showAuth(); authError.textContent="Supabase isn't configured yet - see SETUP_INSTRUCTIONS.md"; }
</script>
